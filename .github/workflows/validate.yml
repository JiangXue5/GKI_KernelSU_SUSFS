name: Validate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  validate:
    name: Validate workflows, shell scripts, and Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate GitHub workflows
        run: python3 .github/scripts/validate_workflows.py

      - name: Validate shell scripts
        run: python3 .github/scripts/validate_shell.py

      - name: Test kernel branding action behaviour
        run: python3 .github/scripts/test_kernel_branding.py

      - name: Test KernelSU Nova version resolution
        # Compares our resolver against upstream's own make evaluation on
        # synthetic repos; also covers shallow clones, detached HEAD, the API
        # fallback, the legacy flavor alias and the SUSFS branch mapping.
        run: python3 .github/scripts/test_ksu_version.py

      - name: Test the BORE port
        # Runs the KABI/sysctl transforms against fixture trees (idempotency,
        # drift = hard failure) and checks the build wiring: the gate defaults
        # off, every leg forwards it, and no patch touches the kernel string.
        run: python3 .github/scripts/test_bore_port.py

      - name: Validate Python syntax
        run: python3 .github/scripts/validate_python.py
