name: Sync Upstream

# 每天检查上游 WildKernels/GKI_KernelSU_SUSFS 是否有新提交。
# 有更新时做两件事：
#   1) 把上游合并进本仓库的 main（以 merge commit 方式，保留可追溯性）
#   2) 可选地立刻触发一次构建（见 inputs.auto_build）
#
# 设计要点：
#   - 合并前用 dry-run 检测冲突。有冲突就开一个 PR 交给你人工处理，
#     绝不强行推送一个可能编译不过的 main。
#   - 上游是本仓库的 fork 父级，因此默认快进（fast-forward）即可，
#     历史保持线性、干净。
#   - 触发构建用的是 GitHub 原生 API，不再依赖 Gitee 那套失效逻辑。
#
# 注意：scheduled 定时任务只会在本文件存在于默认分支之后才生效。

on:
  schedule:
    # 每天 17:00 UTC = 次日 01:00 北京时间。
    # 刻意排在 nightly-build（16:00 UTC）之后一小时，
    # 这样同步到的新代码会出现在同一天的稍晚构建里。
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      auto_build:
        description: "同步到更新后，自动触发一次构建"
        type: boolean
        default: false
      build_inputs:
        description: "构建参数（JSON，留空则使用 build-inputs 任务里的默认值）"
        type: string
        default: ''
      force_build:
        description: "即使本次没有任何上游更新也强制构建"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
  UPSTREAM_REPO: WildKernels/GKI_KernelSU_SUSFS
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.merge.outputs.updated }}
      upstream_sha: ${{ steps.merge.outputs.upstream_sha }}
      conflicts: ${{ steps.merge.outputs.conflicts }}
      pr_url: ${{ steps.pr.outputs.pr_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # 需要写权限来 push 合并结果
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        id: fetch
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"

          git fetch upstream "${UPSTREAM_BRANCH}" --tags

          UPSTREAM_SHA=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "Upstream ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} = ${UPSTREAM_SHA}"

      - name: Detect whether main is behind upstream
        id: check
        run: |
          set -euo pipefail
          # 统计 upstream 领先本地 main 的提交数量
          BEHIND=$(git rev-list --count "main..upstream/${UPSTREAM_BRANCH}")

          echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"

          if [ "$BEHIND" -gt 0 ]; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
            echo "上游有 ${BEHIND} 个新提交："
            git log --oneline "main..upstream/${UPSTREAM_BRANCH}" | head -30
          else
            echo "behind=false" >> "$GITHUB_OUTPUT"
            echo "main 已是最新，无需同步。"
          fi

      - name: Dry-run merge to detect conflicts
        id: trial
        if: steps.check.outputs.behind == 'true'
        run: |
          set -euo pipefail
          if git merge --no-commit --no-ff "upstream/${UPSTREAM_BRANCH}" >/tmp/merge.log 2>&1; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            echo "试合并成功，无冲突。"
            git merge --abort || true
          else
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            echo "检测到冲突，文件列表："
            git diff --name-only --diff-filter=U || true
            git merge --abort || true
          fi

      - name: Merge upstream into main
        id: merge
        run: |
          set -euo pipefail

          UPSTREAM_SHA="${{ steps.fetch.outputs.upstream_sha }}"

          if [ "${{ steps.check.outputs.behind }}" != "true" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ steps.trial.outputs.conflicts }}" = "true" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
            echo "::warning::上游更新与本地修改存在冲突，已转为 PR，请人工处理。"
            exit 0
          fi

          # 无冲突：直接快进合并，保持历史线性。
          # 若无法快进（本地 main 有上游没有的提交），退化为 merge commit。
          if git merge --ff-only "upstream/${UPSTREAM_BRANCH}"; then
            echo "快进合并完成。"
          else
            echo "无法快进，使用 merge commit 方式合并本地定制内容。"
            git merge --no-ff "upstream/${UPSTREAM_BRANCH}" \
              -m "Merge upstream ${UPSTREAM_REPO}@${UPSTREAM_SHA:0:8}"
          fi

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "conflicts=false" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"

      - name: Push merged main
        if: steps.merge.outputs.updated == 'true'
        run: |
          set -euo pipefail
          git push origin main
       