name: Kernel Build Process

# Per-job step summaries are deliberately disabled: the same information is in
# the step logs, and a summary per matrix leg is noise on a 400-job run. Pointing
# GITHUB_STEP_SUMMARY at /dev/null keeps every writer working unchanged.
env:
  GITHUB_STEP_SUMMARY: /dev/null
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sublevel:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      variant:
        required: false
        type: string
      feature_set:
        required: true
        type: string
      ksu_branch:
        required: false
        type: string
        default: ""
      susfs_commit:
        required: false
        type: string
        default: ""
      root_flavor:
        required: false
        type: string
        default: ""
      root_commit:
        required: false
        type: string
        default: ""
      nomount_commit:
        required: false
        type: string
        default: ""
      kernel_patches_commit:
        required: false
        type: string
        default: ""
      anykernel3_commit:
        required: false
        type: string
        default: ""
      droidspaces_commit:
        required: false
        type: string
        default: ""
      brand_name:
        # Empty by default: the caller decides, and an empty value must survive
        # the parent -> child hop instead of being replaced by a brand here.
        required: false
        type: string
        default: ''
      keep_kmi:
        required: false
        type: boolean
        default: false
      allow_version_mismatch:
        required: false
        type: boolean
        default: false
      commit_mode:
        description: "latest or verified, recorded in the build metadata"
        required: false
        type: string
        default: "verified"
      use_bore:
        description: "Apply the BORE scheduler (false = stock CFS/EEVDF, main's previous behaviour)"
        required: false
        type: boolean
        default: false
      bore_variant:
        description: "BORE patch generation for 6.6: 5.9.6 (default) or 5.1.0"
        required: false
        type: string
        default: "5.9.6"
      page_size:
        description: "ARM64 page size: 4k (default) or 16k (Kleaf --page_size)"
        required: false
        type: string
        default: "4k"
      stock_config_artifact:
        description: "Artifact name with prefetched stock configs (stock_<kver>[_16k].config)"
        required: false
        type: string
        default: ""

jobs:
  build-gki:
    name: "${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }} (${{ inputs.variant }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Prefetched Stock Configs
        # Hard requirement: without the stock configs there is nothing to build
        # against, so this waits for the producer leg and then fails the job
        # rather than falling through to a live download.
        #
        # The wait is needed because each family leg calls this workflow
        # separately: the producing leg uploads stock-configs-<family> while a
        # consuming leg may already be running, and GitHub indexes artifacts a
        # few seconds after the upload reports success.
        if: inputs.stock_config_artifact != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ inputs.stock_config_artifact }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p stock-configs
          for attempt in $(seq 1 40); do
            if gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate \
                 --jq '.artifacts[].name' 2>/dev/null | grep -Fxq "$ARTIFACT"; then
              gh run download "$RUN_ID" --repo "$REPO" -n "$ARTIFACT" -D stock-configs
              n=$(find stock-configs -name 'stock_*.config' | wc -l)
              echo "stock configs: $n file(s) from $ARTIFACT"
              [ "$n" -gt 0 ] || { echo "::error title=stock configs::$ARTIFACT is empty"; exit 1; }
              exit 0
            fi
            echo "stock configs: $ARTIFACT not uploaded yet (attempt $attempt/40), waiting 15s"
            sleep 15
          done
          echo "::error title=stock configs::$ARTIFACT was never uploaded - refusing to build without the stock configs"
          exit 1

      - name: Validate Page Size
        uses: ./.github/actions/validate-page-size
        with:
          page_size: ${{ inputs.page_size }}
          version: ${{ inputs.version }}
      - name: Free Disk Space
        if: true
        uses: endersonmenezes/free-disk-space@v4 # Use @main for latest, @v3 for stable
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz" # Use 'rmz' for faster deletion (default: 'rm')
          rmz_version: "3.2.0" # Required when rm_cmd is 'rmz'
          testing: false

      - name: Setup more Swap (for LTO)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: ${{ inputs.version }}
          sublevel: ${{ inputs.sublevel }}
          kernel_patches_commit: ${{ inputs.kernel_patches_commit }}
          anykernel3_commit: ${{ inputs.anykernel3_commit }}

      - name: Download Kernel Repository
        uses: ./.github/actions/download-kernel
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}

      - name: Initialize Config Fragment
        uses: ./.github/actions/initialize-config-fragment
      - name: Spoof /proc/config.gz With Stock Config
        uses: ./.github/actions/stock-config
        with:
          version: ${{ inputs.version }}
          page_size: ${{ inputs.page_size }}
          stock_config_dir: stock-configs

      - name: Set Build Timestamp from Kernel Commit
        uses: ./.github/actions/set-build-timestamp-from-kernel-commit
        with:
          os_patch_level: ${{ inputs.os_patch_level }}
      - name: Extract Sublevel and Set File Name
        id: extract
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ inputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}
          variant: ${{ inputs.variant }}
          page_size: ${{ inputs.page_size }}

      - name: Kernel Fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}

      - name: Reject incompatible root/SUSFS combinations
        # One step for both: these are a single guard, and splitting them only
        # added two composite actions whose whole body was one echo.
        if: (inputs.root_flavor == 'kowsu' && (contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All')) || (inputs.root_flavor == 'finasu' && !contains(inputs.feature_set, 'SUSFS'))
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.root_flavor }}" = "kowsu" ]; then
            echo "ERROR: KowSU does not work together with SUSFS - re-run with SUSFS off." >&2
          else
            echo "ERROR: FinaSU requires SUSFS - re-run with SUSFS on." >&2
          fi
          exit 1
      - name: Setup Selected Root Implementation
        if: inputs.root_flavor != '' && inputs.root_flavor != 'none'
        uses: ./.github/actions/root-setup
        with:
          flavor: ${{ inputs.root_flavor }}
          commit: ${{ inputs.root_commit }}
          # SukiSU Nova keeps its SUSFS hooks on builtin; main has no
          # CONFIG_KSU_SUSFS at all. The action still verifies that the commit
          # is really on the branch and falls back to detecting it.
          branch: ${{ inputs.root_flavor == 'sukisu-nova' && (contains(inputs.feature_set, 'SUSFS') && 'builtin' || 'main') || '' }}

      - name: Report root implementation metadata
        if: inputs.root_flavor != '' && inputs.root_flavor != 'none'
        shell: bash
        env:
          IMPLEMENTATION: ${{ inputs.root_flavor }}
          FEATURE_SET: ${{ inputs.feature_set }}
          COMMIT_MODE_INPUT: ${{ inputs.commit_mode }}
        run: |
          set -euo pipefail
          susfs_mode="disabled"
          case "$FEATURE_SET" in
            *SUSFS*) susfs_mode="enabled" ;;
          esac
          commit_mode="${COMMIT_MODE_INPUT:-latest}"
          {
            echo "Root implementation : ${ROOT_MANAGER:-${IMPLEMENTATION}}"
            echo "Repository          : ${KSU_REPOSITORY:-N/A}"
            echo "Selected branch     : ${KSU_KERNEL_BRANCH:-${ROOT_BRANCH:-N/A}}"
            echo "Selected commit     : ${ROOT_COMMIT:-N/A}"
            echo "Commit mode         : ${commit_mode}"
            echo "SUSFS mode          : ${susfs_mode}"
            echo "KSU_VERSION         : ${KSU_VERSION:-N/A}"
            echo "KSU_VERSION_FULL    : ${KSU_VERSION_FULL:-N/A}"
            echo "VERSION_TAG         : ${KSU_VERSION_TAG:-N/A}"
            echo "Version source      : ${KSU_VERSION_SOURCE:-N/A} (api: ${KSU_API_STATUS:-N/A})"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Mark No Root build metadata
        if: inputs.root_flavor == 'none'
        uses: ./.github/actions/mark-no-root-build-metadata
        with:
          root_flavor: ${{ inputs.root_flavor }}
      - name: Disable SUSFS for BakaSU without SUSFS feature
        if: inputs.root_flavor == 'bakasu' && !contains(inputs.feature_set, 'SUSFS')
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          python3 "${{ github.workspace }}/.github/scripts/append_fragment.py" \
            "${{ github.workspace }}/.github/fragments/disable-susfs-for-bakasu-without-susfs-feature.fragment" \
            --dest wild_defconfig.fragment --label disable-susfs-for-bakasu-without-susfs-feature
      - name: Disable SUSFS for SukiSU Nova without SUSFS feature
        if: inputs.root_flavor == 'sukisu-nova' && !contains(inputs.feature_set, 'SUSFS')
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          python3 "${{ github.workspace }}/.github/scripts/append_fragment.py" \
            "${{ github.workspace }}/.github/fragments/disable-susfs-for-sukisu-nova-without-susfs-feature.fragment" \
            --dest wild_defconfig.fragment --label disable-susfs-for-sukisu-nova-without-susfs-feature
      - name: Single manager for BakaSU (multi-manager off)
        if: inputs.root_flavor == 'bakasu'
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          python3 "${{ github.workspace }}/.github/scripts/append_fragment.py" \
            "${{ github.workspace }}/.github/fragments/single-manager-for-bakasu-multi-manager-off.fragment" \
            --dest wild_defconfig.fragment --label single-manager-for-bakasu-multi-manager-off
      - name: Enable KernelSU toolkit support for BakaSU
        if: inputs.root_flavor == 'bakasu'
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          python3 "${{ github.workspace }}/.github/scripts/append_fragment.py" \
            "${{ github.workspace }}/.github/fragments/enable-kernelsu-toolkit-support-for-bakasu.fragment" \
            --dest wild_defconfig.fragment --label enable-kernelsu-toolkit-support-for-bakasu
      - name: Single manager for SukiSU Nova (trim cert table)
        if: inputs.root_flavor == 'sukisu-nova'
        uses: ./.github/actions/single-manager-for-sukisu-nova-trim-cert-table
        with:
          root_flavor: ${{ inputs.root_flavor }}
      - name: Single manager for FinaSU (dynamic manager off)
        if: inputs.root_flavor == 'finasu'
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/common
        run: |
          python3 "${{ github.workspace }}/.github/scripts/append_fragment.py" \
            "${{ github.workspace }}/.github/fragments/single-manager-for-finasu-dynamic-manager-off.fragment" \
            --dest wild_defconfig.fragment --label single-manager-for-finasu-dynamic-manager-off
      - name: SUSFS
        # One step, one action: resolve the SUSFS commit, apply it for the
        # selected root, then run the post-patch fixes (ksu_close_fd restore,
        # selinux_hide 6.6+ shim). All of that lives in
        # .github/actions/susfs/action.yml - the workflow no longer carries
        # SUSFS shell code.
        uses: ./.github/actions/susfs
        with:
          enabled: ${{ contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All' }}
          susfs_commit: ${{ inputs.susfs_commit }}
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          root_flavor: ${{ inputs.root_flavor }}

      - name: Baseband Guard
        if: (contains(inputs.feature_set, 'BBG') || inputs.feature_set == 'All')
        uses: ./.github/actions/bbg

      - name: Setup Networking
        if: contains(inputs.feature_set, 'NET') || inputs.feature_set == 'All'
        uses: ./.github/actions/networking
        with:
          os_patch_level: ${{ inputs.os_patch_level }}
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: DroidSpaces-OSS Patches
        if: contains(inputs.feature_set, 'DS') || inputs.feature_set == 'All'
        uses: ./.github/actions/droidspaces
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}
          droidspaces_commit: ${{ inputs.droidspaces_commit }}

      - name: USB Arsenal Patches
        # USB gadget functions (mass storage, HID, NCM) plus the kernel-patches
        # folder that makes a second gadget instance and CD-ROM/DVD emulation work.
        # 6.1 has no patch set of its own upstream, so it takes the 5.15 one.
        if: contains(inputs.feature_set, 'USBA') || inputs.feature_set == 'All'
        id: usba
        uses: ./.github/actions/usb-arsenal
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Record the USB Arsenal source commit
        # Feeds the notes and the build metadata; without it a kernel with USB
        # Arsenal is indistinguishable from one without.
        if: contains(inputs.feature_set, 'USBA') || inputs.feature_set == 'All'
        shell: bash
        run: echo "USBA_COMMIT=${{ steps.usba.outputs.commit }}" >> "$GITHUB_ENV"

      # ON BY DEFAULT, and it is NOT free - measured, not assumed. Enabling it
      # changes struct cfs_rq (cfs_bandwidth, throttled lists, throttled_count),
      # and struct rq embeds struct cfs_rq. struct rq * appears in the prototypes
      # of exported symbols - the android vendor-hook tracepoints
      # (__traceiter_android_rvh_*), __task_rq_lock, __migrate_task,
      # __balance_callbacks - so genksyms expands it and their CRCs move. That
      # is what the "breaks the ABI" note was about; include/ has no
      # CONFIG_CFS_BANDWIDTH reference at all, which is why grepping headers
      # misses it.
      - name: Apply NTSync Patches
        if: contains(inputs.feature_set, 'NTSync')
        uses: ./.github/actions/ntsync
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Ptrace Patch
        if: contains(inputs.feature_set, 'Ptrace')
        uses: ./.github/actions/ptrace
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Unicode Fix Patch
        if: contains(inputs.feature_set, 'Unicode')
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Performance Patches
        uses: ./.github/actions/performance
        if: contains(inputs.feature_set, 'Perf')
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Setup Misc Configs
        # Gateable now: this is a baseline, not a requirement. Features that do need
        # overlayfs or tmpfs xattr carry those configs in their own fragments.
        if: contains(inputs.feature_set, 'Misc') || inputs.feature_set == 'All'
        uses: ./.github/actions/misc
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          variant: ${{ inputs.variant }}

      - name: Apply BORE Scheduler
        # Off by default: main has always shipped stock CFS/EEVDF, and the gate
        # keeps that path byte-identical (no patch, no fragment, no extra
        # inputs to any other action).
        if: inputs.use_bore
        uses: ./.github/actions/bore
        with:
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          variant: ${{ inputs.bore_variant || '5.9.6' }}

      # DISABLED: the BPF stack (BTF + eBPF + FUSE-BPF) is off until there is a
      # concrete need for it. Most of it is already in stock GKI (BPF_SYSCALL,
      # DEBUG_INFO_BTF, FUSE_FS are =y on 5.15+), so the action was mainly adding
      # BPF_EVENTS/kprobe/uprobe events and FUSE_BPF - tracing plumbing and an
      # experimental FUSE-over-eBPF path that nothing here uses - at the cost of build
      # time and extra config surface. If you require it, open an issue.
      # - name: Enable BPF Stack (BTF + eBPF + FUSE-BPF)
      #   if: contains(inputs.feature_set, 'BPF')
      #   uses: ./.github/actions/btf
      #   with:
      #     version: ${{ inputs.version }}
      #     kernel_version: ${{ inputs.kernel_version }}
      #     sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Device-Specific Patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Integrate NoMount
        if: contains(inputs.feature_set, 'NoMount') || inputs.feature_set == 'All'
        uses: ./.github/actions/nomount
        with:
          commit: ${{ inputs.nomount_commit }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Kernel Branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: ${{ inputs.variant }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          version: ${{ inputs.version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          brand_name: ${{ inputs.brand_name }}
          keep_kmi: ${{ inputs.keep_kmi }}

      - name: Remove Protected Exports
        uses: ./.github/actions/remove-protected-exports

      - name: Clean Kernel Flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Scan and collect patch rejects
        id: scan
        if: always()
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload Rejects
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      - name: Apply Kernel Bypass Hack
        if: ${{ inputs.allow_version_mismatch == 'true' }}
        uses: ./.github/actions/bypass-kernel
        with:
          version: ${{ inputs.version }}
          allow_version_mismatch: true

      - name: Build Normal Kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
          KBUILD_BUILD_USER: ${{ (inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12' || inputs.version == 'android17-6.18') && 'kleaf' || 'build-user' }}
          KBUILD_BUILD_HOST: build-host
        uses: ./.github/actions/build-kernel
        with:
          version: ${{ inputs.version }}
          page_size: ${{ inputs.page_size }}

      - name: Verify KernelSU Nova version in the artifact
        # The version the manager reads back has to be the one this build
        # resolved, not a number another stage invented. KSU_VERSION_FULL is a
        # string in .rodata, so it can be read out of the image itself; the
        # numeric macro is checked in the compiler command lines when Kleaf
        # keeps them.
        if: inputs.root_flavor == 'sukisu-nova'
        shell: bash
        run: |
          set -uo pipefail
          : "${KSU_VERSION:?KSU_VERSION was not resolved by root-setup}"
          : "${KSU_VERSION_FULL:?KSU_VERSION_FULL was not resolved by root-setup}"

          IMG=""
          for candidate in \
            "$GITHUB_WORKSPACE/AnyKernel3/Image" \
            "$GITHUB_WORKSPACE/kernel/bazel-bin/common/kernel_aarch64/Image" \
            "/home/runner/out/dist/Image"; do
            if [ -f "$candidate" ]; then IMG="$candidate"; break; fi
          done
          if [ -z "$IMG" ]; then
            echo "::error::no built Image found; cannot verify KSU_VERSION_FULL"
            exit 1
          fi
          echo "image: $IMG"
          if ! strings -a "$IMG" | grep -qF -- "$KSU_VERSION_FULL"; then
            echo "::error::KSU_VERSION_FULL '$KSU_VERSION_FULL' is not in $IMG"
            echo "found instead:"
            strings -a "$IMG" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-' | sort -u | head -5 || true
            exit 1
          fi
          echo "[ok] KSU_VERSION_FULL in image : $KSU_VERSION_FULL"

          # Bounded: the tree can hold tens of thousands of .cmd files and a
          # full-tree grep would add minutes to every build for a warning-only
          # check. Kleaf's output tree is where the kernelsu objects live.
          CMD_HIT="$(timeout 90 grep -rIl --include='*.cmd' -m1 -- "-DKSU_VERSION=${KSU_VERSION}" \
            "$GITHUB_WORKSPACE/kernel/bazel-bin" "$GITHUB_WORKSPACE/kernel/out" 2>/dev/null | head -n 1 || true)"
          if [ -n "$CMD_HIT" ]; then
            echo "[ok] KSU_VERSION in compile flags: ${KSU_VERSION} (${CMD_HIT#"$GITHUB_WORKSPACE"/})"
          else
            echo "::warning::no .cmd file carries -DKSU_VERSION=${KSU_VERSION}; the numeric value is only proven by the pinned build file and the FULL string"
          fi

      - name: Verify Kernel Release String
        # End-to-end check: the version inside the built Image must be the stock
        # version (computed from the untouched setlocalversion + the real build
        # config) with only the KMI/brand tokens inserted. A green build alone
        # does not prove the suffix survived.
        uses: ./.github/actions/verify-kernel-release
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          page_size: ${{ inputs.page_size }}

      - name: ABI gate
        # Compares Module.symvers CRCs against the stock ABI of the tree that was
        # built and fails on any symbol whose CRC moved.
        uses: ./.github/actions/abi-gate
        with:
          version: ${{ inputs.version }}
          date: ${{ inputs.os_patch_level }}

      - name: Capture the exported CRCs when the ABI gate fails
        # A BORE build tripping the gate is answered with evidence, not a re-run:
        # the artefact carries both sides of the comparison (our Module.symvers
        # and the stock .stg the gate read), so the drift can be diffed offline
        # instead of guessed at from a 40-symbol excerpt.
        if: failure() && inputs.use_bore
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-abi-evidence
          path: |
            ${{ github.workspace }}/kernel/bazel-bin/common/kernel_aarch64/Module.symvers
            ${{ github.workspace }}/kernel/common/android/abi_gki_aarch64.stg
          if-no-files-found: warn
          retention-days: 5
          compression-level: 9

      - name: Extract the built .config
        if: always()
        uses: ./.github/actions/extract-the-built-config
      - name: Verify the fragment landed in .config
        uses: ./.github/actions/verify-fragment

      - name: Consolidated Build Summary
        id: build-summary
        if: always()
        uses: ./.github/actions/build-summary
        with:
          job_status: ${{ job.status }}
          file_name: ${{ steps.extract.outputs.file_name }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ inputs.sublevel }}
          android_version: ${{ inputs.android_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          variant: ${{ inputs.variant }}
          page_size: ${{ inputs.page_size }}
          feature_set: ${{ inputs.feature_set }}
          nomount_commit: ${{ inputs.nomount_commit }}
          susfs_commit: ${{ inputs.susfs_commit }}

      - name: Upload Artifacts
        id: kernel-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-AnyKernel3
          path: ${{ github.workspace }}/AnyKernel3/**
          if-no-files-found: ignore
          compression-level: 9

      - name: Write Build-verified only artifact metadata
        if: success() && inputs.root_flavor != '' && inputs.root_flavor != 'none'
        uses: ./.github/actions/build-metadata
        with:
          summary_base: ${{ steps.build-summary.outputs.summary_base }}
          file_name: ${{ steps.extract.outputs.file_name }}
          feature_set: ${{ inputs.feature_set }}
          nomount_commit: ${{ inputs.nomount_commit }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          page_size: ${{ inputs.page_size }}
          commit_mode: ${{ inputs.commit_mode }}

      - name: Upload Build Summary + Metadata
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-BuildInfo
          path: |
            /tmp/build-summary-${{ steps.build-summary.outputs.summary_base }}.md
            ${{ github.workspace }}/built.config
            ${{ github.workspace }}/build-reports/**
          if-no-files-found: warn
          compression-level: 9
