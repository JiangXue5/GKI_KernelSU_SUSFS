name: gki-6677-backport

# gki6677 P1 pipeline (plan §6, §7). One job = one full answer:
#   pinned fetch -> series apply -> build.sh -> version check -> ABI gate
#   -> AK3 packaging -> artifacts (+ optional release).
#
# Triggers:
#   - push to gki6677 touching the project tree -> automatic pure build
#     (this is the primary trigger: workflow_dispatch UI/gh only lists
#     workflows that exist on the default branch, and the WildKernels
#     engine on main-chandr1000 must stay untouched)
#   - workflow_dispatch with optional release_tag (usable from the UI/gh
#     once this file also lands on the default branch)
#
# The KSU+SUSFS flavor job arrives with P6 and will chain on this job with
# needs: (plan §6 rule: never debug two variables at once).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "If set: create a GitHub release with this tag on a green gate (e.g. v0.77-baseline). Empty = artifacts only."
        required: false
        default: ""
  push:
    branches:
      - gki6677
    paths:
      - "gki6677/series.conf"
      - "gki6677/patches/**"
      - "gki6677/scripts/**"
      - "gki6677/abi-baseline/**"
      - ".github/workflows/gki-6677-backport.yml"

permissions:
  contents: write  # release publishing (bot B2 role) — built-in GITHUB_TOKEN, Tier-1

concurrency:
  group: gki6677-build-${{ github.ref }}
  cancel-in-progress: false

env:
  KERNEL_BRANCH: android15-6.6-2025-03
  # deprecated/android15-6.6-2025-03 tip (2026-03-30) = r33 + 1 unrespun commit.
  # The device daily-drives a build of this exact commit with all 268 stock
  # vendor modules — the baseline choice is empirically pre-proven (plan P0).
  KERNEL_PIN: 8d05d8f2439f6a6659b324db458b27fb2f53bb50
  OUT_DIR: /home/runner/out

jobs:
  pure:
    name: pure (zero custom patches vs pin)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout gki6677 project branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set contract git identity (plan §3.4)
        run: |
          git config --global user.name  "Irina Shinakawa"
          git config --global user.email "25380803+chandr1000@users.noreply.github.com"

      - name: Free disk space (Wild-proven inline cleanup)
        run: |
          # Mirror of Wild's .github/actions/disk-cleanup, kept inline so the
          # pipeline trusts nothing outside this repo: instantly relocate the
          # runner's unneeded multi-GB trees, then purge in the background
          # while the (long) source sync runs.
          mkdir -p .background_trash
          mv_bg() { sudo mv "$1" .background_trash/ 2>/dev/null || true; }
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/aws-sam-cli \
                   /usr/local/share/chromium /usr/local/share/powershell \
                   /usr/local/lib/heroku /usr/local/lib/node_modules /opt/az \
                   /opt/microsoft/powershell /opt/hostedtoolcache/go \
                   /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/node; do
            mv_bg "$d" &
          done
          wait
          ( sudo nice -n 19 ionice -c 3 rm -rf .background_trash \
              && sudo apt-get clean ) >/dev/null 2>&1 &
          disown || true
          echo "Disk after cleanup:"
          df -h /

      - name: Fetch pinned Google source (repo manifest + pin enforcement)
        run: gki6677/scripts/fetch-googlesource.sh "$KERNEL_BRANCH" "$KERNEL_PIN"

      - name: Apply patch series (empty series = bit-exact Google tip)
        run: gki6677/scripts/apply-series.sh gki6677/series.conf

      - name: Build GKI (build.sh, build.config.gki.aarch64, 4k, LTO=thin)
        working-directory: kernel
        run: |
          set -euo pipefail
          # Same env contract as the proven Wild build (build-kernel action):
          # legacy build.sh, kernel-only artifacts, out-of-tree OUT_DIR.
          sed -i 's/check_defconfig//' ./common/build.config.gki
          BUILD_GKI_ARTIFACTS="" \
          BUILD_GKI_CERTIFICATION_TOOLS=0 \
          BUILD_SYSTEM_DLKM=0 \
          SKIP_VENDOR_BOOT=1 \
          SKIP_EXT_MODULES=1 \
          SKIP_CP_KERNEL_HDR=1 \
          OUT_DIR="${OUT_DIR}" \
          LTO=thin \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          build/build.sh -j"$(nproc)"

      - name: Locate build outputs
        id: locate
        run: |
          set -euo pipefail
          IMG="$(find "${OUT_DIR}" -maxdepth 3 -type f -name Image | head -n1 || true)"
          SYM="$(find "${OUT_DIR}" -maxdepth 4 -type f -name Module.symvers | head -n1 || true)"
          CFG="$(find "${OUT_DIR}" -maxdepth 3 -type f -name .config | head -n1 || true)"
          if [ -z "$IMG" ]; then
            echo "ERROR: kernel Image not found under ${OUT_DIR}" >&2
            find "${OUT_DIR}" -maxdepth 3 -type f | head -50 >&2 || true
            exit 1
          fi
          if [ -z "$SYM" ]; then
            echo "ERROR: Module.symvers not found under ${OUT_DIR}" >&2
            exit 1
          fi
          echo "image=${IMG}"   >> "$GITHUB_OUTPUT"
          echo "symvers=${SYM}" >> "$GITHUB_OUTPUT"
          echo "config=${CFG}"  >> "$GITHUB_OUTPUT"
          echo "Image: ${IMG} ($(stat -c%s "$IMG") bytes)"
          echo "Module.symvers: ${SYM} ($(stat -c%s "$SYM") bytes)"

      - name: Verify uname -r contract (§10.2 check #1, pre-flash)
        run: |
          set -euo pipefail
          V="$(strings "${{ steps.locate.outputs.image }}" | grep -m1 '^Linux version' || true)"
          echo "banner: ${V}"
          if ! echo "$V" | grep -Eq '^Linux version 6\.6\.77-android15-8-g[0-9a-f]{12}'; then
            echo "ERROR: version string violates the 6.6.77-android15-8-g<hash> contract" >&2
            exit 1
          fi
          echo "version contract satisfied: SUBLEVEL=77, KMI generation 8, git suffix present"

      - name: ABI gate (zero-delta vs baseline; capture mode for shot #1)
        run: |
          set -euo pipefail
          BASE="gki6677/abi-baseline/Module.symvers.baseline"
          mkdir -p abi-out
          if [ -f "$BASE" ]; then
            gki6677/scripts/abi-gate.sh check "$BASE" "${{ steps.locate.outputs.symvers }}" abi-out/abi-delta.txt
          else
            echo "no baseline yet — G1 CAPTURE mode: this build's Module.symvers becomes the project baseline"
            gki6677/scripts/abi-gate.sh capture "${{ steps.locate.outputs.symvers }}" abi-out
            cp "${{ steps.locate.outputs.config }}" abi-out/.config-6677 2>/dev/null || true
          fi

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          gki6677/scripts/build-ak3.sh pure "${{ steps.locate.outputs.image }}" "gki6677-pure-${{ github.run_id }}"
          mv "gki6677-pure-${{ github.run_id }}.zip" abi-out/
          echo "AK3 zip: abi-out/gki6677-pure-${{ github.run_id }}.zip"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## gki6677 pure build"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| source | \`${KERNEL_BRANCH}\` @ \`${KERNEL_SOURCE_COMMIT:-${KERNEL_PIN}}\` |"
            echo "| upstream subject | ${KERNEL_SOURCE_SUBJECT:-(n/a)} |"
            echo "| series | $(grep -cvE '^\s*(#|$)' gki6677/series.conf || true) patch(es) |"
            echo "| verdict | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts (always — debug from logs, not reruns)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gki6677-pure-${{ github.run_id }}
          path: abi-out/
          if-no-files-found: warn

      - name: Publish release (dispatch-only, green gate)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          {
            echo "gki6677 pure flavor — ${TAG}"
            echo
            echo "- source: \`${KERNEL_BRANCH}\` @ \`${KERNEL_SOURCE_COMMIT:-${KERNEL_PIN}}\` (${KERNEL_SOURCE_DATE:-pinned})"
            echo "- series: $(grep -cvE '^\s*(#|$)' gki6677/series.conf || true) patch(es) applied"
            echo "- ABI gate: green — zero delta vs baseline"
            echo "- flavor: pure (no KernelSU/SUSFS)"
            echo
            echo "Flash via AnyKernel3 zip; verify per plan §10.2."
          } > release-notes.md
          ASSETS=(abi-out/*.zip)
          if [ -f abi-out/Module.symvers.baseline ]; then
            ASSETS+=(abi-out/Module.symvers.baseline)
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file release-notes.md "${ASSETS[@]}"
          echo "release ${TAG} published"
