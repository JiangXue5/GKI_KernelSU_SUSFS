name: gki-6677-backport

# gki6677 P1 pipeline (plan §6, §7). One job = one full answer:
#   pinned fetch -> series apply -> Kleaf build -> version check -> ABI gate
#   -> AK3 packaging -> artifacts (+ optional release).
#
# Build system note (shot-#1 fix, 2026-10-31): on android15-6.6 the official
# kernel/manifest ships kernel/build as the Kleaf (Bazel) tree; legacy
# build/build.sh does NOT exist on this branch (that was run 111717902680's
# exit-127 failure). Kleaf defaults reproduce the stock uname contract
# exactly — see the Build step comments for the full proof chain.
#
# Triggers:
#   - push to gki6677 touching the project tree -> automatic pure build
#     (this is the primary trigger: workflow_dispatch UI/gh only lists
#     workflows that exist on the default branch, and the WildKernels
#     engine on main-chandr1000 must stay untouched)
#   - workflow_dispatch with optional release_tag (usable from the UI/gh
#     once this file also lands on the default branch)
#
# The KSU+SUSFS flavor job arrives with P6 and will chain on this job with
# needs: (plan §6 rule: never debug two variables at once).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "If set: create a GitHub release with this tag on a green gate (e.g. v0.77-baseline). Empty = artifacts only."
        required: false
        default: ""
  push:
    branches:
      - gki6677
    paths:
      - "gki6677/series.conf"
      - "gki6677/patches/**"
      - "gki6677/scripts/**"
      - "gki6677/abi-baseline/**"
      - ".github/workflows/gki-6677-backport.yml"

permissions:
  contents: write  # release publishing (bot B2 role) — built-in GITHUB_TOKEN, Tier-1

concurrency:
  group: gki6677-build-${{ github.ref }}
  cancel-in-progress: false

env:
  KERNEL_BRANCH: android15-6.6-2025-03
  # deprecated/android15-6.6-2025-03 tip (2026-03-30) = r33 + 1 unrespun commit.
  # The device daily-drives a build of this exact commit with all 268 stock
  # vendor modules — the baseline choice is empirically pre-proven (plan P0).
  KERNEL_PIN: 8d05d8f2439f6a6659b324db458b27fb2f53bb50

jobs:
  pure:
    name: pure (zero custom patches vs pin)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout gki6677 project branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set contract git identity (plan §3.4)
        run: |
          git config --global user.name  "Irina Shinakawa"
          git config --global user.email "25380803+chandr1000@users.noreply.github.com"

      - name: Free disk space (Wild-proven inline cleanup)
        run: |
          # Mirror of Wild's .github/actions/disk-cleanup, kept inline so the
          # pipeline trusts nothing outside this repo: instantly relocate the
          # runner's unneeded multi-GB trees, then purge in the background
          # while the (long) source sync runs.
          mkdir -p .background_trash
          mv_bg() { sudo mv "$1" .background_trash/ 2>/dev/null || true; }
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /usr/local/aws-sam-cli \
                   /usr/local/share/chromium /usr/local/share/powershell \
                   /usr/local/lib/heroku /usr/local/lib/node_modules /opt/az \
                   /opt/microsoft/powershell /opt/hostedtoolcache/go \
                   /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/node; do
            mv_bg "$d" &
          done
          wait
          ( sudo nice -n 19 ionice -c 3 rm -rf .background_trash \
              && sudo apt-get clean ) >/dev/null 2>&1 &
          disown || true
          echo "Disk after cleanup:"
          df -h /

      - name: Fetch pinned Google source (repo manifest + pin enforcement)
        run: gki6677/scripts/fetch-googlesource.sh "$KERNEL_BRANCH" "$KERNEL_PIN"

      - name: Apply patch series (empty series = bit-exact Google tip)
        run: gki6677/scripts/apply-series.sh gki6677/series.conf

      - name: Build GKI (Kleaf/Bazel — kernel_aarch64, 4k, LTO=thin default)
        working-directory: kernel
        run: |
          set -euo pipefail
          # Kleaf invocation = byte-exact Wild-proven recipe (same manifest,
          # same runners, this exact device's daily kernel). Why each piece
          # is exactly what the stock contract needs — all verified against
          # kernel/build @ a4049bc9debc, the SHA the manifest superproject
          # pins for common-android15-6.6-2025-03:
          #   - //common:kernel_aarch64/Image: declared output. Building it
          #     runs the monolithic kbuild action, which atomically also
          #     materializes kernel_aarch64_Module.symvers
          #     (keep_module_symvers=True) and the dependency action output
          #     kernel_aarch64_config/out_dir/.config.
          #   - 4k page size: kleaf's default arm64 fragment sets
          #     CONFIG_LOCALVERSION="-4k" — the stock banner suffix.
          #   - LTO: gki_defconfig carries CONFIG_LTO_CLANG_THIN=y; kleaf's
          #     lto=default resolves to thin (Wild log: "lto=default;trim").
          #   - scmversion (run-2 fix, 111725723452): --config=stamp embeds it,
          #     but kleaf must first DISCOVER Git projects — via a repo/.repo
          #     root or --extra_git_project only (kleaf/docs/scmversion.md:
          #     "If your workspace is not controlled with repo, use
          #     --extra_git_project"). Our workspace is bare git clones, so
          #     round 2 warned "Can't determine STABLE_SCMVERSIONS for common"
          #     and shipped the -g-less banner 6.6.77-android15-8-4k. The flag
          #     feeds workspace_status_stamp.py the project list; with the
          #     default --kleaf_localversion it then stamps -g<12-char common
          #     HEAD> (= 8d05d8f2439f for the empty series; apply-series.sh
          #     guarantees a clean tree either way, so no -dirty) and derives
          #     a real SOURCE_DATE_EPOCH from the commit date instead of 0.
          #   - Belt-and-suspenders: if stamping is ever lost, the non-stamp
          #     fallback would emit "-maybe-dirty" into uname; neutralize it.
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" \
            build/kernel/kleaf/impl/stamp.bzl
          tools/bazel build \
            --extra_git_project common \
            --config=fast \
            --config=stamp \
            --disk_cache=/home/runner/.cache/bazel \
            //common:kernel_aarch64/Image

      - name: Locate build outputs (Kleaf bazel-bin layout)
        id: locate
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE:-$PWD}"
          IMG="${WS}/kernel/bazel-bin/common/kernel_aarch64/Image"
          SYM="${WS}/kernel/bazel-bin/common/kernel_aarch64/kernel_aarch64_Module.symvers"
          CFG="${WS}/kernel/bazel-bin/common/kernel_aarch64_config/out_dir/.config"
          # Hard expectations, not guesses: these are declared outputs of
          # //common:kernel_aarch64 (Module.symvers copy = keep_module_symvers,
          # .config = kernel_config dependency action). Missing = build bug.
          for f in "$IMG" "$SYM"; do
            if [ ! -s "$f" ]; then
              echo "ERROR: expected kleaf output missing/empty: ${f}" >&2
              find "${WS}/kernel/bazel-bin" -maxdepth 4 2>/dev/null | head -50 >&2 || true
              exit 1
            fi
          done
          echo "image=${IMG}"   >> "$GITHUB_OUTPUT"
          echo "symvers=${SYM}" >> "$GITHUB_OUTPUT"
          echo "config=${CFG}"  >> "$GITHUB_OUTPUT"
          echo "Image: ${IMG} ($(stat -c%s "$IMG") bytes)"
          echo "Module.symvers: ${SYM} ($(stat -c%s "$SYM") bytes)"
          if [ -s "$CFG" ]; then
            echo ".config: ${CFG} ($(stat -c%s "$CFG") bytes)"
          else
            echo "WARNING: .config not found (non-fatal)"
          fi

      - name: "Verify uname -r contract (§10.2 check #1, pre-flash)"
        run: |
          set -euo pipefail
          V="$(strings "${{ steps.locate.outputs.image }}" | grep -m1 '^Linux version' || true)"
          echo "banner: ${V}"
          if ! echo "$V" | grep -Eq '^Linux version 6\.6\.77-android15-8-g[0-9a-f]{12}'; then
            echo "ERROR: version string violates the 6.6.77-android15-8-g<hash> contract" >&2
            exit 1
          fi
          # The -g<hash> must equal kernel/common's git HEAD: for the empty
          # series that is the pinned Google tip itself; for patched series
          # it is the series commit apply-series.sh created (and because
          # --config=stamp + the stamp.bzl guard suppress it, no -dirty noise
          # can leak into the banner even though the tree carries edits).
          EXPECTED="$(git -C kernel/common rev-parse --short=12 HEAD)"
          BANNER_HASH="$(echo "$V" | sed -n 's/.*-g\([0-9a-f]\{12\}\).*/\1/p')"
          echo "expected scmversion hash: ${EXPECTED} (kernel/common HEAD)"
          if [ "${BANNER_HASH}" != "${EXPECTED}" ]; then
            echo "ERROR: banner hash ${BANNER_HASH:-<none>} != kernel/common HEAD ${EXPECTED}" >&2
            exit 1
          fi
          echo "version contract satisfied: SUBLEVEL=77, KMI generation 8, scmversion = kernel/common HEAD"

      - name: "ABI gate (zero-delta vs baseline; capture mode for shot #1)"
        run: |
          set -euo pipefail
          BASE="gki6677/abi-baseline/Module.symvers.baseline"
          mkdir -p abi-out
          if [ -f "$BASE" ]; then
            gki6677/scripts/abi-gate.sh check "$BASE" "${{ steps.locate.outputs.symvers }}" abi-out/abi-delta.txt
          else
            echo "no baseline yet — G1 CAPTURE mode: this build's Module.symvers becomes the project baseline"
            gki6677/scripts/abi-gate.sh capture "${{ steps.locate.outputs.symvers }}" abi-out
            # non-hidden name: upload-artifact skips dotfiles by default
            if [ -s "${{ steps.locate.outputs.config }}" ]; then
              cp "${{ steps.locate.outputs.config }}" abi-out/config-6677.txt
            fi
          fi

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          gki6677/scripts/build-ak3.sh pure "${{ steps.locate.outputs.image }}" "gki6677-pure-${{ github.run_id }}"
          mv "gki6677-pure-${{ github.run_id }}.zip" abi-out/
          echo "AK3 zip: abi-out/gki6677-pure-${{ github.run_id }}.zip"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## gki6677 pure build"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| source | \`${KERNEL_BRANCH}\` @ \`${KERNEL_SOURCE_COMMIT:-${KERNEL_PIN}}\` |"
            echo "| upstream subject | ${KERNEL_SOURCE_SUBJECT:-(n/a)} |"
            echo "| series | $(grep -cvE '^\s*(#|$)' gki6677/series.conf || true) patch(es) |"
            echo "| verdict | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts (always — debug from logs, not reruns)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gki6677-pure-${{ github.run_id }}
          path: abi-out/
          if-no-files-found: warn

      - name: Publish release (dispatch-only, green gate)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          {
            echo "gki6677 pure flavor — ${TAG}"
            echo
            echo "- source: \`${KERNEL_BRANCH}\` @ \`${KERNEL_SOURCE_COMMIT:-${KERNEL_PIN}}\` (${KERNEL_SOURCE_DATE:-pinned})"
            echo "- series: $(grep -cvE '^\s*(#|$)' gki6677/series.conf || true) patch(es) applied"
            echo "- ABI gate: green — zero delta vs baseline"
            echo "- flavor: pure (no KernelSU/SUSFS)"
            echo
            echo "Flash via AnyKernel3 zip; verify per plan §10.2."
          } > release-notes.md
          ASSETS=(abi-out/*.zip)
          if [ -f abi-out/Module.symvers.baseline ]; then
            ASSETS+=(abi-out/Module.symvers.baseline)
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file release-notes.md "${ASSETS[@]}"
          echo "release ${TAG} published"
