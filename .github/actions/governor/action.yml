name: 'Add Governors'
description: 'Adds custom CPU frequency governors (Reflex / Vorpal / Bara-no-Seidou) and the fair.c gaming-mode bias to the kernel'

inputs:
  reflex:
    description: 'Inject the Reflex governor (default true; set false to skip)'
    required: false
    type: string
    default: 'true'
  vorpal:
    description: 'Inject the Vorpal governor + rfx_gki510_compat shim (default true; set false to skip)'
    required: false
    type: string
    default: 'true'
  bara_no_seidou:
    description: 'Inject the Bara-no-Seidou governor (default true; set false to skip; needs vorpal for the compat shim)'
    required: false
    type: string
    default: 'true'
  gaming_bias:
    description: 'Inject the fair.c sched_gaming_active gaming bias (default true; auto-skips on non-matching trees; needs vorpal for the compat shim)'
    required: false
    type: string
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: 'Inject Reflex Governor'
      if: inputs.reflex != 'false'
      shell: bash
      run: |
        set -euo pipefail
        TARGET_DIR="$GITHUB_WORKSPACE/kernel/common"
        # Governor floor: sched_cpu_util() first exists in 5.15 and loses
        # its capacity argument in 6.1 (handled inside the sources). On
        # 5.10 it does not exist at all — warn + skip (plan D2/D3 probe
        # policy; recorded in PATCHES.yml kernels fields).
        GOV_MAJ="$(sed -n 's/^VERSION *= *//p' $TARGET_DIR/Makefile | head -n1)"
        GOV_MIN="$(sed -n 's/^PATCHLEVEL *= *//p' $TARGET_DIR/Makefile | head -n1)"
        if [ -z "${GOV_MAJ:-}" ] || [ "${GOV_MAJ}" -lt 5 ] || { [ "${GOV_MAJ}" -eq 5 ] && [ "${GOV_MIN}" -lt 15 ]; }; then
          echo "::warning::Governors unsupported on Linux ${GOV_MAJ:-?}.${GOV_MIN:-?} (need >= 5.15): skipping this step (D2/D3)." >&2
          exit 0
        fi

        mkdir -p "$TARGET_DIR/kernel/sched"
        cp "${{ github.action_path }}/patches/reflex/cpufreq_reflex.c" "$TARGET_DIR/kernel/sched/cpufreq_reflex.c"

        if ! grep -q "cpufreq_reflex.o" "$TARGET_DIR/kernel/sched/Makefile"; then
          echo 'obj-$(CONFIG_CPU_FREQ_GOV_REFLEX) += cpufreq_reflex.o' >> "$TARGET_DIR/kernel/sched/Makefile"
        fi

        if ! grep -q "config CPU_FREQ_GOV_REFLEX" "$TARGET_DIR/drivers/cpufreq/Kconfig"; then
          printf "\nconfig CPU_FREQ_GOV_REFLEX\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\ttristate \"'reflex' cpufreq governor\"\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\tdepends on CPU_FREQ && SMP\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\tselect CPU_FREQ_GOV_ATTR_SET\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\thelp\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\t  'reflex' is an advanced CPU frequency governor based on schedutil,\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\t  featuring idle-time accounting and PELT-complementary exponential decay.\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
        fi

    - name: 'Inject Vorpal Governor + GKI510 Compat'
      if: inputs.vorpal != 'false'
      shell: bash
      run: |
        set -euo pipefail
        TARGET_DIR="$GITHUB_WORKSPACE/kernel/common"
        # Governor floor: sched_cpu_util() first exists in 5.15 and loses
        # its capacity argument in 6.1 (handled inside the sources). On
        # 5.10 it does not exist at all — warn + skip (plan D2/D3 probe
        # policy; recorded in PATCHES.yml kernels fields).
        GOV_MAJ="$(sed -n 's/^VERSION *= *//p' $TARGET_DIR/Makefile | head -n1)"
        GOV_MIN="$(sed -n 's/^PATCHLEVEL *= *//p' $TARGET_DIR/Makefile | head -n1)"
        if [ -z "${GOV_MAJ:-}" ] || [ "${GOV_MAJ}" -lt 5 ] || { [ "${GOV_MAJ}" -eq 5 ] && [ "${GOV_MIN}" -lt 15 ]; }; then
          echo "::warning::Governors unsupported on Linux ${GOV_MAJ:-?}.${GOV_MIN:-?} (need >= 5.15): skipping this step (D2/D3)." >&2
          exit 0
        fi

        mkdir -p "$TARGET_DIR/kernel/sched"
        cp "${{ github.action_path }}/patches/vorpal/cpufreq_vorpal.c" "$TARGET_DIR/kernel/sched/cpufreq_vorpal.c"
        cp "${{ github.action_path }}/patches/vorpal/rfx_gki510_compat.c" "$TARGET_DIR/kernel/sched/rfx_gki510_compat.c"

        if ! grep -q "cpufreq_vorpal.o" "$TARGET_DIR/kernel/sched/Makefile"; then
          echo 'obj-$(CONFIG_CPU_FREQ_GOV_VORPAL) += cpufreq_vorpal.o' >> "$TARGET_DIR/kernel/sched/Makefile"
        fi

        if ! grep -q "rfx_gki510_compat.o" "$TARGET_DIR/kernel/sched/Makefile"; then
          echo 'obj-y += rfx_gki510_compat.o' >> "$TARGET_DIR/kernel/sched/Makefile"
        fi

        if ! grep -q "config CPU_FREQ_GOV_VORPAL" "$TARGET_DIR/drivers/cpufreq/Kconfig"; then
          printf "\nconfig CPU_FREQ_GOV_VORPAL\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\ttristate \"'vorpal' cpufreq governor\"\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\tdepends on CPU_FREQ && SMP\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\tselect CPU_FREQ_GOV_ATTR_SET\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\thelp\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\t  'vorpal' is a schedutil-based governor tuned for\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\t  gaming/thermal-aware dual-profile operation.\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
        fi

    - name: 'Fix Vorpal Input-Handler Init Bug'
      if: inputs.vorpal != 'false'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        # Governor floor: sched_cpu_util() first exists in 5.15 and loses
        # its capacity argument in 6.1 (handled inside the sources). On
        # 5.10 it does not exist at all — warn + skip (plan D2/D3 probe
        # policy; recorded in PATCHES.yml kernels fields).
        GOV_MAJ="$(sed -n 's/^VERSION *= *//p' Makefile | head -n1)"
        GOV_MIN="$(sed -n 's/^PATCHLEVEL *= *//p' Makefile | head -n1)"
        if [ -z "${GOV_MAJ:-}" ] || [ "${GOV_MAJ}" -lt 5 ] || { [ "${GOV_MAJ}" -eq 5 ] && [ "${GOV_MIN}" -lt 15 ]; }; then
          echo "::warning::Governors unsupported on Linux ${GOV_MAJ:-?}.${GOV_MIN:-?} (need >= 5.15): skipping this step (D2/D3)." >&2
          exit 0
        fi
        VORPAL_C="kernel/sched/cpufreq_vorpal.c"

        if ! grep -q "bool input_ok;" "$VORPAL_C"; then
          perl -0pi -e 's{(static int __init vorpal_gov_init\(void\)\n\{\n\tint ret;\n)}{$1\tbool input_ok;\n}' "$VORPAL_C"
        fi

        if ! grep -q "input_ok = !input_register_handler" "$VORPAL_C"; then
          perl -0pi -e 's{\tif \(input_register_handler\(&rfx_input_handler\)\)\n\t\tpr_warn\("vorpal: input handler register failed \(touch boost off\)\\n"\);}{\tinput_ok = !input_register_handler(&rfx_input_handler);\n\tif (!input_ok)\n\t\tpr_warn("vorpal: input handler register failed (touch boost off)\\n");}' "$VORPAL_C"
        fi

        if ! grep -q "if (input_ok)" "$VORPAL_C"; then
          perl -0pi -e 's{\tret = cpufreq_register_governor\(&vorpal_gov\);\n\tif \(ret\) \{\n\t\tinput_unregister_handler\(&rfx_input_handler\);\n\t\tcancel_delayed_work_sync\(&rfx_thermal_work\);\n\t\}}{\tret = cpufreq_register_governor(&vorpal_gov);\n\tif (ret) \{\n\t\tif (input_ok)\n\t\t\tinput_unregister_handler(&rfx_input_handler);\n\t\tcancel_delayed_work_sync(&rfx_thermal_work);\n\t\}}' "$VORPAL_C"
        fi

        if ! grep -q "bool input_ok;" "$VORPAL_C"; then
          echo "ERROR: failed to inject 'bool input_ok;' into vorpal_gov_init()" >&2
          exit 1
        fi
        if ! grep -q "input_ok = !input_register_handler" "$VORPAL_C"; then
          echo "ERROR: failed to patch input_register_handler() call in vorpal_gov_init()" >&2
          exit 1
        fi
        if ! grep -q "if (input_ok)" "$VORPAL_C"; then
          echo "ERROR: failed to guard input_unregister_handler() in vorpal_gov_init() error path" >&2
          exit 1
        fi

    - name: 'Inject Bara-no-Seidou Governor'
      if: inputs.bara_no_seidou != 'false'
      shell: bash
      run: |
        set -euo pipefail
        TARGET_DIR="$GITHUB_WORKSPACE/kernel/common"
        # Governor floor: sched_cpu_util() first exists in 5.15 and loses
        # its capacity argument in 6.1 (handled inside the sources). On
        # 5.10 it does not exist at all — warn + skip (plan D2/D3 probe
        # policy; recorded in PATCHES.yml kernels fields).
        GOV_MAJ="$(sed -n 's/^VERSION *= *//p' $TARGET_DIR/Makefile | head -n1)"
        GOV_MIN="$(sed -n 's/^PATCHLEVEL *= *//p' $TARGET_DIR/Makefile | head -n1)"
        if [ -z "${GOV_MAJ:-}" ] || [ "${GOV_MAJ}" -lt 5 ] || { [ "${GOV_MAJ}" -eq 5 ] && [ "${GOV_MIN}" -lt 15 ]; }; then
          echo "::warning::Governors unsupported on Linux ${GOV_MAJ:-?}.${GOV_MIN:-?} (need >= 5.15): skipping this step (D2/D3)." >&2
          exit 0
        fi

        # Bara-no-Seidou consumes sched_gaming_active, defined by the
        # rfx_gki510_compat shim (vorpal commit). Skip gracefully when the
        # shim is not part of this action (vorpal feature reverted).
        if [ ! -f "${{ github.action_path }}/patches/vorpal/rfx_gki510_compat.c" ]; then
          echo "WARNING: rfx_gki510_compat.c (compat shim, vorpal commit) not found - Bara-no-Seidou needs its sched_gaming_active; SKIPPING Bara-no-Seidou injection." >&2
          exit 0
        fi

        mkdir -p "$TARGET_DIR/kernel/sched"
        cp "${{ github.action_path }}/patches/bara-no-seidou/cpufreq_bara_no_seidou.c" "$TARGET_DIR/kernel/sched/cpufreq_bara_no_seidou.c"

        if ! grep -q "cpufreq_bara_no_seidou.o" "$TARGET_DIR/kernel/sched/Makefile"; then
          echo 'obj-$(CONFIG_CPU_FREQ_GOV_BARA_NO_SEIDOU) += cpufreq_bara_no_seidou.o' >> "$TARGET_DIR/kernel/sched/Makefile"
        fi

        if ! grep -q "config CPU_FREQ_GOV_BARA_NO_SEIDOU" "$TARGET_DIR/drivers/cpufreq/Kconfig"; then
          printf "\nconfig CPU_FREQ_GOV_BARA_NO_SEIDOU\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\ttristate \"'bara-no-seidou' cpufreq governor\"\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\tdepends on CPU_FREQ && SMP && INPUT\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\tselect CPU_FREQ_GOV_ATTR_SET\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\thelp\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\t  'bara-no-seidou' is a schedutil-based governor tuned for\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\t  battery efficiency with an automatic gaming-mode switch,\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
          printf "\t  touch-boost smoothing, and PSI-aware tuning.\n" >> "$TARGET_DIR/drivers/cpufreq/Kconfig"
        fi

        if ! grep -q "cpufreq_bara_no_seidou.o" "$TARGET_DIR/kernel/sched/Makefile"; then
          echo "ERROR: failed to wire cpufreq_bara_no_seidou.o into sched/Makefile" >&2
          exit 1
        fi
        if ! grep -q "config CPU_FREQ_GOV_BARA_NO_SEIDOU" "$TARGET_DIR/drivers/cpufreq/Kconfig"; then
          echo "ERROR: failed to inject CPU_FREQ_GOV_BARA_NO_SEIDOU Kconfig entry" >&2
          exit 1
        fi

    - name: 'Inject Gaming-Mode Bias into fair.c (best-effort)'
      if: inputs.gaming_bias != 'false'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        # Governor floor: sched_cpu_util() first exists in 5.15 and loses
        # its capacity argument in 6.1 (handled inside the sources). On
        # 5.10 it does not exist at all — warn + skip (plan D2/D3 probe
        # policy; recorded in PATCHES.yml kernels fields).
        GOV_MAJ="$(sed -n 's/^VERSION *= *//p' Makefile | head -n1)"
        GOV_MIN="$(sed -n 's/^PATCHLEVEL *= *//p' Makefile | head -n1)"
        if [ -z "${GOV_MAJ:-}" ] || [ "${GOV_MAJ}" -lt 5 ] || { [ "${GOV_MAJ}" -eq 5 ] && [ "${GOV_MIN}" -lt 15 ]; }; then
          echo "::warning::Governors unsupported on Linux ${GOV_MAJ:-?}.${GOV_MIN:-?} (need >= 5.15): skipping this step (D2/D3)." >&2
          exit 0
        fi
        FAIR_C="kernel/sched/fair.c"

        # The bias only links when something defines sched_gaming_active; the
        # rfx_gki510_compat shim (vorpal commit) is the sole definer here.
        if [ ! -f "${{ github.action_path }}/patches/vorpal/rfx_gki510_compat.c" ]; then
          echo "WARNING: rfx_gki510_compat.c (compat shim, vorpal commit) not found; SKIPPING fair.c gaming bias." >&2
          exit 0
        fi

        # Best-effort by design (plan decision D2): all five injections run
        # against a TEMP copy and the result only replaces fair.c when every
        # marker is present. On trees where an anchor drifted (future
        # sublevels, BORE rewrites, non-Android bases) this step WARNs and
        # SKIPS instead of failing the build - the governors remain fully
        # functional without the bias (the shim still provides
        # sched_gaming_active, vorpal/bara just idle in non-gaming mode).
        TMP_FAIR="$(mktemp /tmp/fair.c.gaming.XXXXXX)"
        cp "$FAIR_C" "$TMP_FAIR"

        if ! grep -qF "extern int sched_gaming_active;" "$TMP_FAIR"; then
          perl -0pi -e 's{(static unsigned int normalized_sysctl_sched_latency\s*=\s*6000000ULL;)}{$1\n\nextern int sched_gaming_active;\n\n#define GAMING_VRUNTIME_STRETCH\t\t4\n}' "$TMP_FAIR"
        fi

        if ! grep -qF "GAMING_VRUNTIME_STRETCH - 1" "$TMP_FAIR"; then
          perl -0pi -e 's{(\tcurr->vruntime \+= calc_delta_fair\(delta_exec, curr\);\n)(\tupdate_min_vruntime\(cfs_rq\);\n)}{$1\n\tif (unlikely(sched_gaming_active \&\& !entity_is_task(curr))) {\n\t\tcurr->vruntime += calc_delta_fair(delta_exec * (GAMING_VRUNTIME_STRETCH - 1), curr);\n\t} else if (unlikely(sched_gaming_active \&\& entity_is_task(curr) \&\&\n\t\t\t     curr->avg.load_avg < 100)) {\n\t\tcurr->vruntime += calc_delta_fair(delta_exec, curr);\n\t}\n$2}' "$TMP_FAIR"
        fi

        if ! grep -qF "delta_exec > ideal_runtime / 2" "$TMP_FAIR"; then
          perl -0pi -e 's{(\tdelta_exec = curr->sum_exec_runtime - curr->prev_sum_exec_runtime;\n)(\ttrace_android_rvh_check_preempt_tick)}{$1\n\tif (unlikely(sched_gaming_active) \&\& entity_is_task(curr)) {\n\t\tstruct task_struct *p = task_of(curr);\n\n\t\tif (p->static_prio > DEFAULT_PRIO \&\n\t\t    delta_exec > ideal_runtime / 2)\n\t\t\tresched_curr(rq_of(cfs_rq));\n\t}\n\n$2}' "$TMP_FAIR"
        fi

        if ! grep -qF "task_of(se)->static_prio <= DEFAULT_PRIO" "$TMP_FAIR"; then
          perl -0pi -e 's{(\tfor_each_sched_entity\(se\) \{\n\t\tcfs_rq = cfs_rq_of\(se\);\n\n)(\t\tupdate_load_avg\(cfs_rq, se, UPDATE_TG\);\n\t\tse_update_runnable\(se\);\n\t\tupdate_cfs_group\(se\);)}{$1\t\tif (unlikely(sched_gaming_active \&\& entity_is_task(se) \&\&\n\t\t\t     task_of(se)->static_prio <= DEFAULT_PRIO))\n\t\t\tse->vruntime -= min_t(u64, se->vruntime, NSEC_PER_MSEC);\n\n$2}' "$TMP_FAIR"
        fi

        if ! grep -qF "Gaming task isolation" "$TMP_FAIR"; then
          perl -0pi -e 's{(\tdelta = rq_clock_task\(env->src_rq\) - p->se\.exec_start;\n\n)(\treturn delta < \(s64\)sysctl_sched_migration_cost;\n\}\n)}{$1\t/* Gaming task isolation */\n\tif (sched_gaming_active) {\n\t\tif (capacity_orig_of(env->dst_cpu) < capacity_orig_of(env->src_cpu) \&\&\n\t\t    task_util(p) > (capacity_orig_of(env->src_cpu) >> 3))\n\t\t\treturn 1;\n\t\treturn delta < (s64)sysctl_sched_migration_cost * 2;\n\t}\n\n$2}' "$TMP_FAIR"
        fi

        MISSING=""
        for MARK in "extern int sched_gaming_active;" "GAMING_VRUNTIME_STRETCH - 1" "delta_exec > ideal_runtime / 2" "task_of(se)->static_prio <= DEFAULT_PRIO" "Gaming task isolation"; do
          if ! grep -qF "$MARK" "$TMP_FAIR"; then
            MISSING="${MISSING}${MARK}\n"
          fi
        done
        if [ -n "$MISSING" ]; then
          echo "WARNING: fair.c does not match the expected anchors - SKIPPING gaming bias (best-effort mode, fair.c left untouched)." >&2
          echo "Missing markers:" >&2
          printf "${MISSING}" >&2
          rm -f "$TMP_FAIR"
          exit 0
        fi

        cat "$TMP_FAIR" > "$FAIR_C"
        rm -f "$TMP_FAIR"
        echo "fair.c gaming bias applied (all 5 markers verified)."

    - name: Enable Governors
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_CPU_FREQ_GOV_REFLEX=y
          CONFIG_CPU_FREQ_GOV_VORPAL=y
          CONFIG_CPU_FREQ_GOV_BARA_NO_SEIDOU=y
