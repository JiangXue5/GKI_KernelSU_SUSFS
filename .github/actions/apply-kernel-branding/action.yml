name: 'Apply Kernel Branding & Timestamp'
description: 'Apply kernel branding to kernel version string'
inputs:
  variant:
    description: 'Variant of kernel to apply branding to'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  version:
    description: 'Combined version (e.g., android14-6.1)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  brand_name:
    description: 'Branding text appended to the version (e.g., Wild). Empty = stock version string.'
    required: false
    default: ''
  keep_kmi:
    description: 'Keep the stock KMI generation suffix (e.g. -android15-8). Off = brand only, KMI untouched.'
    required: false
    default: 'false'

outputs:
  modified:
    description: 'true when scripts/setlocalversion was rewritten'
    value: ${{ steps.brand.outputs.modified }}
  version_suffix:
    description: 'Text appended to the version string (empty when the tree is left untouched)'
    value: ${{ steps.brand.outputs.version_suffix }}
  kmi_preserved:
    description: 'true only when keep_kmi was requested AND probing the rewritten script yielded the expected -androidXX-N exactly once'
    value: ${{ steps.brand.outputs.kmi_preserved }}
  kmi_status:
    description: 'not-requested | missing-config | already-present | injected | unverified'
    value: ${{ steps.brand.outputs.kmi_status }}
  release_preview:
    description: >-
      Version string produced by the rewritten script in an isolated probe.
      Informational only: the probe runs before any config exists (and, on the
      Kleaf lanes, without the git metadata the real build never sees either),
      so this is the shape of the string, not a prediction of the built one.
      The built string is checked by .github/actions/verify-kernel-release.
    value: ${{ steps.brand.outputs.release_preview }}

runs:
  using: "composite"
  steps:
    - name: Apply Kernel Name Branding
      id: brand
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      # Inputs go through the environment, not through ${{ }} interpolation:
      # brand_name is user supplied, and interpolating it into the script body
      # would let it close a quote and run shell code.
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_SUBLEVEL: ${{ inputs.sublevel }}
        INPUT_BRAND: ${{ inputs.brand_name }}
        INPUT_KEEP_KMI: ${{ inputs.keep_kmi }}
      run: |
        set -euo pipefail

        VERSION="${INPUT_VERSION:-}"
        SUBLEVEL="${INPUT_SUBLEVEL:-}"
        BRAND_RAW="${INPUT_BRAND:-}"
        KEEP_KMI="${INPUT_KEEP_KMI:-false}"

        # The brand is embedded both in a generated shell snippet and in the
        # kernel release string, so only a conservative alphabet survives:
        # letters, digits and . _ + - . Everything else (quotes, $, backticks,
        # backslashes, glob characters, control characters, colons, slashes)
        # is dropped; runs of whitespace collapse to '-'. A brand that survives
        # as the empty string is treated as "no brand" and reported, never
        # silently written as a bare '-' suffix.
        BRAND="$(printf '%s' "$BRAND_RAW" | tr -d '\000-\037' \
          | sed -e 's/[[:space:]]\{1,\}/-/g' \
                -e 's/[^A-Za-z0-9._+-]//g' \
                -e 's/^[-._]*//' \
                -e 's/[-._]*$//')"
        if [ -n "$BRAND_RAW" ] && [ -z "$BRAND" ]; then
          echo "::warning title=brand_name ignored::brand_name contains no characters usable in a kernel version string (allowed: A-Z a-z 0-9 . _ + -); the stock version string is kept."
        fi
        if [ "${#BRAND}" -gt 32 ]; then
          echo "::warning title=brand_name truncated::brand_name is longer than 32 usable characters; truncated to '${BRAND:0:32}'."
          BRAND="${BRAND:0:32}"
        fi

        case "$KEEP_KMI" in
          true|True|TRUE) KEEP_KMI=true ;;
          *) KEEP_KMI=false ;;
        esac

        SCRIPT=scripts/setlocalversion

        # The post-build check (.github/actions/verify-kernel-release) needs the
        # untouched script to compute the stock release string from the real
        # build config, plus the tokens this run inserted. Everything it needs
        # is written here; the stock copy is never overwritten with a branded
        # script, otherwise a second run would take its own output as baseline.
        STATE_DIR="${GITHUB_WORKSPACE:-$(cd ../.. 2>/dev/null && pwd || printf '%s' "$PWD")}/.kernel-branding"

        __save_stock_script() {
          [ -f "$SCRIPT" ] || return 0
          mkdir -p "$STATE_DIR" 2>/dev/null || return 0
          if grep -q '__wild_rel\|wild-branding-format=' "$SCRIPT" 2>/dev/null; then
            return 0   # already branded: keep the pristine copy from the first run
          fi
          cp "$SCRIPT" "$STATE_DIR/setlocalversion.stock" 2>/dev/null || true
        }

        __write_state() {   # $1 = modified (true|false)
          mkdir -p "$STATE_DIR" 2>/dev/null || return 0
          # The early exit leaves before the format is parsed; the verifier needs
          # it to know whether the script emits a full release or a suffix.
          local fmt="${FMT_LABEL:-}"
          if [ -z "$fmt" ]; then
            fmt="$(sed -n 's/^# wild-branding-format=\(full\|suffix\)$/\1/p' "$SCRIPT" 2>/dev/null | head -n 1)"
            if [ -z "$fmt" ] && [ -f "$SCRIPT" ]; then
              if grep -q '\${KERNELVERSION}' "$SCRIPT"; then fmt=full; else fmt=suffix; fi
            fi
          fi
          {
            printf 'format=%s\n' "$fmt"
            printf 'kernel_version=%s\n' "${PROBE_KVER:-}"
            printf 'branch=%s\n' "${CFG_BRANCH:-${VERSION:-}}"
            printf 'kmi_generation=%s\n' "${CFG_KMI:-}"
            printf 'kmi_suffix=%s\n' "${KMI_SUFFIX:-}"
            printf 'extra_suffix=%s\n' "${EXTRA_SUFFIX:-}"
            printf 'expected_kmi=%s\n' "${EXPECTED_KMI:-}"
            printf 'kmi_mode=%s\n' "${KMI_MODE:-}"
            printf 'kmi_from=%s\n' "${KMI_FROM:-}"
            printf 'kmi_to=%s\n' "${KMI_TO:-}"
            printf 'brand_suffix=%s\n' "${BRAND_SUFFIX:-}"
            printf 'kmi_status=%s\n' "${KMI_STATUS:-}"
            printf 'keep_kmi=%s\n' "$KEEP_KMI"
            printf 'modified=%s\n' "$1"
          } > "$STATE_DIR/state.env" 2>/dev/null || true
        }

        # android15-6.6 -> android15
        ANDROID_TOKEN="${VERSION%%-*}"
        KERNEL_PART="${VERSION#*-}"

        PROBE_KVER=""
        if [ -n "$KERNEL_PART" ] && [ -n "$SUBLEVEL" ]; then
          PROBE_KVER="${KERNEL_PART}.${SUBLEVEL}"
        fi

        # KMI generation + branch come from the tree, not from the workflow
        # inputs: build.config.common sources build.config.constants, and either
        # file may carry the pair. 5.10/6.1 hand both to setlocalversion as
        # arguments (and that script prints -android14-11 itself); 6.6/6.12/6.18
        # get them through the Kleaf build config.
        CFG_KMI=""
        CFG_BRANCH=""
        for f in build.config.common build.config.constants; do
          [ -f "$f" ] || continue
          if [ -z "$CFG_KMI" ]; then
            CFG_KMI="$(sed -n 's/^[[:space:]]*KMI_GENERATION[[:space:]]*=[[:space:]]*\([^#[:space:]]*\).*$/\1/p' "$f" | head -n 1 | tr -d "\"'")"
          fi
          if [ -z "$CFG_BRANCH" ]; then
            CFG_BRANCH="$(sed -n 's/^[[:space:]]*BRANCH[[:space:]]*=[[:space:]]*\([^#[:space:]]*\).*$/\1/p' "$f" | head -n 1 | tr -d "\"'")"
          fi
        done
        # A branch of the wrong shape (or a non-numeric generation) must not
        # end up inside the release string.
        case "$CFG_KMI" in
          ''|*[!0-9]*) [ -n "$CFG_KMI" ] && echo "::warning title=KMI_GENERATION ignored::KMI_GENERATION='${CFG_KMI}' is not numeric; treating it as absent." >&2; CFG_KMI="" ;;
        esac
        case "$CFG_BRANCH" in
          android[0-9]*) ANDROID_TOKEN="${CFG_BRANCH%%-*}" ;;
          *) [ -n "$CFG_BRANCH" ] && echo "::warning title=BRANCH ignored::BRANCH='${CFG_BRANCH}' does not start with androidN; using '${ANDROID_TOKEN}' from the workflow input." >&2 ;;
        esac
        case "$ANDROID_TOKEN" in
          android[0-9]*) ;;
          *) ANDROID_TOKEN="" ;;
        esac

        # ---------------------------------------------------------------
        # No brand and no KMI request: the stock string is already correct, so
        # scripts/setlocalversion must not be touched at all. This is the
        # default for manual runs and is what keeps Google's version string
        # (android release, KMI generation, sublevel, git description) intact.
        # ---------------------------------------------------------------
        if [ -z "$BRAND" ] && [ "$KEEP_KMI" != true ]; then
          echo "brand_name is empty and keep_kmi is off: leaving scripts/setlocalversion untouched (stock version string)"
          __save_stock_script
          __write_state false
          {
            echo "modified=false"
            echo "version_suffix="
            echo "kmi_preserved=false"
            echo "kmi_status=not-requested"
            echo "release_preview="
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ ! -f "$SCRIPT" ]; then
          echo "::error::$PWD/$SCRIPT is missing; cannot apply branding." >&2
          exit 1
        fi

        __save_stock_script

        # ---------------------------------------------------------------
        # Work out which shape the tree uses. The last echo is the release
        # producer in every AOSP variant: 6.6/6.12/6.18 echo the complete
        # KERNELRELEASE (${KERNELVERSION}...), 5.10/6.1 echo a suffix that the
        # Makefile prefixes with $(KERNELVERSION).
        # ---------------------------------------------------------------
        LAST_ECHO_NO="$(grep -n '^[[:space:]]*echo[[:space:]]' "$SCRIPT" | tail -n 1 | cut -d: -f1 || true)"
        if [ -z "$LAST_ECHO_NO" ]; then
          echo "::error::no echo statement found in $SCRIPT; refusing to rewrite an unknown version format." >&2
          exit 1
        fi
        LAST_ECHO="$(sed -n "${LAST_ECHO_NO}p" "$SCRIPT")"
        EXPR="${LAST_ECHO#*echo}"
        EXPR="${EXPR#"${EXPR%%[![:space:]]*}"}"
        case "$EXPR" in
          \"*\") EXPR="${EXPR#\"}"; EXPR="${EXPR%\"}" ;;
          *)
            echo "::error::last echo in $SCRIPT is not a double-quoted string (${LAST_ECHO}); refusing to guess the version format." >&2
            exit 1
            ;;
        esac
        FORMAT_FULL=false
        case "$EXPR" in
          *'${KERNELVERSION}'*) FORMAT_FULL=true ;;
        esac
        # A re-run sees `echo "$__wild_rel"` and would lose the knowledge that
        # this is a full-release tree. The first run records it in a trailing
        # comment so the probe keeps passing the right arguments.
        FORMAT_MARKER="$(sed -n 's/^# wild-branding-format=\(full\|suffix\)$/\1/p' "$SCRIPT" | head -n 1)"
        if [ -n "$FORMAT_MARKER" ]; then
          if [ "$FORMAT_MARKER" = full ]; then FORMAT_FULL=true; else FORMAT_FULL=false; fi
        fi
        FMT_LABEL=suffix
        if [ "$FORMAT_FULL" = true ]; then FMT_LABEL=full; fi

        # ---------------------------------------------------------------
        # Probe: run the script in an isolated copy and look at what it really
        # emits. Branding happens before `make defconfig`, so include/config/
        # auto.conf does not exist yet; the probe synthesises the minimum the
        # script needs.
        #
        # Git visibility is not the same on both lanes, and pretending
        # otherwise is how a previous version of this action came to advertise
        # "-g<hash>" for builds that can never produce it:
        #   * 5.10/6.1 (build/build.sh) run make inside the real source tree,
        #     so scripts/setlocalversion does see .git;
        #   * 6.6+ (Kleaf) builds in a sandbox without .git and only stamps the
        #     SCM version when --config=stamp is set. This workflow uses
        #     --config=fast, so the release string carries no -g<hash> at all.
        # The probe therefore mirrors the lane instead of always inventing a
        # git repo. Nothing depends on the hash anyway: the before/after
        # comparison only looks at what this action appends.
        # ---------------------------------------------------------------
        PROBE_GIT=false
        if [ "$FORMAT_FULL" != true ]; then PROBE_GIT=true; fi

        __probe_raw() {
          local src="$1" shape="$2" with_git="$3" dir out=""
          dir="$(mktemp -d)"
          mkdir -p "$dir/include/config"
          cp "$src" "$dir/setlocalversion"
          if [ -f include/config/auto.conf ]; then
            cp include/config/auto.conf "$dir/include/config/auto.conf"
          else
            printf '%s\n' 'CONFIG_LOCALVERSION_AUTO=y' > "$dir/include/config/auto.conf"
          fi
          for f in localversion*; do
            [ -e "$f" ] && cp -R "$f" "$dir/" 2>/dev/null || true
          done
          if [ "$with_git" = true ]; then
            (
              cd "$dir" || exit 1
              git init -q . >/dev/null 2>&1 || exit 1
              git -c user.email=probe@branding.invalid -c user.name=probe \
                -c commit.gpgsign=false commit -q --allow-empty -m probe >/dev/null 2>&1
            ) >/dev/null 2>&1 || true
          fi
          if [ "$shape" = full ]; then
            out="$( cd "$dir" && KERNELVERSION="$PROBE_KVER" LOCALVERSION= sh ./setlocalversion . 2>/dev/null )" || out=""
          elif [ -n "$CFG_KMI" ]; then
            out="$( cd "$dir" && KERNELVERSION="$PROBE_KVER" LOCALVERSION= sh ./setlocalversion . "${CFG_BRANCH:-$VERSION}" "$CFG_KMI" 2>/dev/null )" || out=""
          else
            out="$( cd "$dir" && KERNELVERSION="$PROBE_KVER" LOCALVERSION= sh ./setlocalversion . "${CFG_BRANCH:-$VERSION}" 2>/dev/null )" || out=""
          fi
          rm -rf "$dir"
          printf '%s' "$out"
        }

        # Try the shape the tree declares first, then the other one: a tree that
        # was branded by an older copy of this action has no format marker, and
        # guessing wrong must degrade to "probe failed", never to a wrong claim.
        # Git visibility stays what the declared lane implies for both attempts.
        __probe() {
          local src="$1" out=""
          out="$(__probe_raw "$src" "$FMT_LABEL" "$PROBE_GIT")"
          if [ -z "$out" ]; then
            if [ "$FMT_LABEL" = full ]; then
              out="$(__probe_raw "$src" suffix "$PROBE_GIT")"
            else
              out="$(__probe_raw "$src" full "$PROBE_GIT")"
            fi
          fi
          printf '%s' "$out"
        }

        occurrences() {
          local s="$1" t="$2" n=0
          while [ -n "$s" ] && [ "${s#*"$t"}" != "$s" ]; do
            n=$((n + 1))
            s="${s#*"$t"}"
          done
          printf '%s' "$n"
        }

        # git hashes differ between the two probes (each has its own commit),
        # so they are normalised before the before/after comparison.
        normalise() {
          local s="$1"
          # Undo exactly what this run changes (not the KMI the tree may
          # already emit): keep_kmi=false appends -android15, keep_kmi=true
          # appends -android15-8, merge rewrites -android15 into -android15-8,
          # the brand is appended last.
          [ -n "$BRAND_SUFFIX" ] && s="${s//$BRAND_SUFFIX/}"
          if [ "$KMI_MODE" = merge ]; then
            s="${s//$KMI_TO/$KMI_FROM}"
          elif [ -n "$EXTRA_SUFFIX" ]; then
            s="${s//$EXTRA_SUFFIX/}"
          fi
          printf '%s' "$s" | sed -E 's/-g[0-9a-f]{6,}/-gHASH/g'
        }

        EXPECTED_KMI=""
        if [ -n "$CFG_KMI" ] && [ -n "$ANDROID_TOKEN" ]; then
          EXPECTED_KMI="-${ANDROID_TOKEN}-${CFG_KMI}"
        fi
        BRAND_SUFFIX=""
        if [ -n "$BRAND" ]; then
          BRAND_SUFFIX="-${BRAND}"
        fi

        STOCK_REL="$(__probe "$SCRIPT")"
        STOCK_OK=false
        if [ -n "$STOCK_REL" ]; then STOCK_OK=true; fi

        # ---------------------------------------------------------------
        # Does the tree itself put the expected KMI generation into the string?
        # Decision is made from the probe output, not from `grep kmi_generation`:
        # 5.10/6.1 only print -android14-11 inside `if git rev-parse --verify
        # HEAD`, and only when scm_version() is reached, so a grep hit can be a
        # false positive (no git tree, CONFIG_LOCALVERSION_AUTO off, ...).
        # ---------------------------------------------------------------
        TREE_ADDS_KMI=false
        if [ "$STOCK_OK" = true ] && [ -n "$EXPECTED_KMI" ] \
           && [ "$(occurrences "$STOCK_REL" "$EXPECTED_KMI")" -ge 1 ]; then
          TREE_ADDS_KMI=true
        elif [ "$STOCK_OK" != true ] && grep -q 'kmi_generation' "$SCRIPT"; then
          # Probe failed and the script is the legacy shape: assume the tree
          # appends it itself, otherwise a real build would get it twice.
          # kmi_preserved stays false because nothing was confirmed.
          TREE_ADDS_KMI=true
        fi

        KMI_SUFFIX=""
        KMI_MODE=""
        KMI_FROM=""
        KMI_TO=""
        KMI_STATUS="not-requested"
        if [ "$KEEP_KMI" = true ]; then
          if [ -z "$EXPECTED_KMI" ]; then
            echo "::warning title=KMI not preserved::keep_kmi=true but a numeric KMI_GENERATION could not be read from build.config.common/build.config.constants; the version string keeps whatever the tree produces and no numeric KMI suffix is added."
            KMI_STATUS="missing-config"
          elif [ "$TREE_ADDS_KMI" = true ]; then
            KMI_STATUS="already-present"
          elif [ "$STOCK_OK" = true ] \
               && [ "$(occurrences "$STOCK_REL" "-${ANDROID_TOKEN}")" -ge 1 ]; then
            # The tree emits the android release token but not the generation
            # (or an earlier run appended -android15 only). Completing the pair
            # in place keeps one token: -android15 -> -android15-8.
            KMI_MODE=merge
            KMI_FROM="-${ANDROID_TOKEN}"
            KMI_TO="$EXPECTED_KMI"
            KMI_STATUS="extended"
          else
            KMI_SUFFIX="$EXPECTED_KMI"
            KMI_STATUS="injected"
          fi
        fi

        # Token inserted before the brand. keep_kmi carries the generation
        # (-android15-8); with it off the android release token is still kept,
        # because every release this project shipped carried it and device-side
        # parsers look for it - dropping it would be a naming regression.
        # Both are inserted only when the emitted string does not already have
        # them, so the stock suffix is never duplicated.
        EXTRA_SUFFIX="$KMI_SUFFIX"
        if [ -z "$EXTRA_SUFFIX" ] && [ -n "$BRAND_SUFFIX" ] && [ -n "$ANDROID_TOKEN" ]; then
          if [ "$STOCK_OK" = true ] && [ "$(occurrences "$STOCK_REL" "-${ANDROID_TOKEN}")" -ge 1 ]; then
            EXTRA_SUFFIX=""
          else
            EXTRA_SUFFIX="-${ANDROID_TOKEN}"
          fi
        fi

        # keep_kmi asked for, tree already emits it, no brand: the stock string
        # is already what was asked for, so leave the file alone.
        if [ -z "$EXTRA_SUFFIX" ] && [ -z "$BRAND_SUFFIX" ] && [ -z "$KMI_MODE" ]; then
          echo "nothing to append (KMI already emitted by the tree, no brand): leaving $SCRIPT untouched"
          echo "  probe mode  : ${FMT_LABEL} shape, git visible=${PROBE_GIT} (mirrors the build lane)"
          KMI_PRESERVED=false
          if [ "$KMI_STATUS" = "already-present" ] && [ "$STOCK_OK" = true ] \
             && [ "$(occurrences "$STOCK_REL" "$EXPECTED_KMI")" -eq 1 ]; then
            KMI_PRESERVED=true
          elif [ "$KMI_STATUS" = "already-present" ]; then
            echo "::warning title=KMI not verified::the tree is expected to emit ${EXPECTED_KMI} but it could not be observed in a probe; reporting kmi_preserved=false."
            KMI_STATUS="unverified"
          fi
          {
            echo "modified=false"
            echo "version_suffix="
            echo "kmi_preserved=${KMI_PRESERVED}"
            echo "kmi_status=${KMI_STATUS}"
            echo "release_preview=${STOCK_REL}"
          } >> "$GITHUB_OUTPUT"
          __write_state false
          exit 0
        fi

        # Rewrite the value of the LAST echo, whichever shape it has:
        #   5.10/6.1  -> echo "$res"                          (a suffix; make prepends KERNELVERSION)
        #   6.6+      -> echo "${KERNELVERSION}...${scm_version}" (the whole release string)
        # Either way the emitted text is preserved verbatim and only gets the
        # extra tokens appended, so nothing is dropped or reordered.
        #
        # Both appends are guarded at run time so a re-run can never produce
        # -Wild-Wild or a duplicated -android15-8.
        #
        # Kleaf trees emit the whole release string, so a KMI that the tree does
        # not produce itself belongs right after ${KERNELVERSION} (6.6.77-android15-8-4k-g...),
        # not at the very end where it would sit behind the git description.
        # Legacy trees emit a suffix that make prefixes with KERNELVERSION, so
        # appending keeps the same layout.
        BLOCK="$(mktemp)"
        {
          printf '%s\n' '__wild_rel="'"${EXPR}"'"'
          if [ "$KMI_MODE" = merge ]; then
            printf '%s\n' "case \"\$__wild_rel\" in"
            printf '%s\n' "  *\"${KMI_TO}\"*) ;;"
            printf '%s\n' "  *\"${KMI_FROM}\"*) __wild_rel=\"\$(printf '%s' \"\$__wild_rel\" | sed 's/${KMI_FROM}/${KMI_TO}/')\" ;;"
            printf '%s\n' "esac"
          elif [ -n "$EXTRA_SUFFIX" ]; then
            if [ "$FORMAT_FULL" = true ]; then
              printf '%s\n' "case \"\$__wild_rel\" in"
              printf '%s\n' "  *\"${EXTRA_SUFFIX}\"*) ;;"
              printf '%s\n' "  \"\${KERNELVERSION}\"*) __wild_rel=\"\${KERNELVERSION}${EXTRA_SUFFIX}\${__wild_rel#\"\${KERNELVERSION}\"}\" ;;"
              printf '%s\n' "  *) __wild_rel=\"\${__wild_rel}${EXTRA_SUFFIX}\" ;;"
              printf '%s\n' "esac"
            else
              printf '%s\n' "case \"\$__wild_rel\" in *\"${EXTRA_SUFFIX}\"*) ;; *) __wild_rel=\"\${__wild_rel}${EXTRA_SUFFIX}\" ;; esac"
            fi
          fi
          if [ -n "$BRAND_SUFFIX" ]; then
            printf '%s\n' "case \"\$__wild_rel\" in *\"${BRAND_SUFFIX}\") ;; *) __wild_rel=\"\${__wild_rel}${BRAND_SUFFIX}\" ;; esac"
          fi
          printf '%s\n' 'echo "$__wild_rel"'
        } > "$BLOCK"

        awk -v n="$LAST_ECHO_NO" -v blockfile="$BLOCK" '
          NR == n { while ((getline line < blockfile) > 0) print line; next }
          { print }
        ' "$SCRIPT" > "$SCRIPT.new"
        mv "$SCRIPT.new" "$SCRIPT"
        rm -f "$BLOCK"
        if [ -z "$FORMAT_MARKER" ]; then
          printf '\n# wild-branding-format=%s\n' "$FMT_LABEL" >> "$SCRIPT"
        fi
        chmod +x "$SCRIPT"

        # A broken script would fail the build hours later, in the middle of the
        # kernel compile; check the syntax and the shape right now.
        if ! bash -n "$SCRIPT"; then
          echo "::error::rewritten $SCRIPT does not parse" >&2
          exit 1
        fi

        # ---------------------------------------------------------------
        # Verify by running the rewritten script, not by inspecting it:
        # the release string must contain the expected KMI exactly once and
        # must be identical to the stock string once the appended tokens are
        # removed (no lost sublevel / page size / git description).
        # ---------------------------------------------------------------
        AFTER_REL="$(__probe "$SCRIPT")"
        KMI_PRESERVED=false
        if [ "$KEEP_KMI" = true ] && [ -n "$EXPECTED_KMI" ]; then
          if [ -z "$AFTER_REL" ]; then
            echo "::warning title=KMI not verified::the rewritten $SCRIPT could not be executed in a probe; reporting kmi_preserved=false."
            KMI_STATUS="unverified"
          else
            KMI_COUNT="$(occurrences "$AFTER_REL" "$EXPECTED_KMI")"
            if [ "$KMI_COUNT" -eq 1 ]; then
              KMI_PRESERVED=true
            else
              echo "::warning title=KMI not verified::expected exactly one '${EXPECTED_KMI}' in the emitted version string but found ${KMI_COUNT} (${AFTER_REL})."
              KMI_STATUS="unverified"
            fi
          fi
        fi

        if [ "$STOCK_OK" = true ] && [ -n "$AFTER_REL" ]; then
          if [ "$(normalise "$STOCK_REL")" != "$(normalise "$AFTER_REL")" ]; then
            echo "::error::rewritten $SCRIPT changes the version string beyond the appended tokens: stock='${STOCK_REL}' new='${AFTER_REL}'" >&2
            exit 1
          fi
        fi

        echo "Kernel $VERSION (kernel ${KERNEL_PART}, sublevel ${SUBLEVEL:-?})"
        echo "  brand       : ${BRAND:-<none>}"
        echo "  keep_kmi    : ${KEEP_KMI}"
        echo "  kmi edit    : $( [ "$KMI_MODE" = merge ] && printf '%s -> %s' "$KMI_FROM" "$KMI_TO" || printf '%s' "${EXTRA_SUFFIX:-<none>}" )"
        echo "  appended    : ${BRAND_SUFFIX:-<none>}"
        echo "  kmi_status  : ${KMI_STATUS} (preserved=${KMI_PRESERVED})"
        echo "  probe mode  : ${FMT_LABEL} shape, git visible=${PROBE_GIT} (mirrors the build lane)"
        echo "  stock probe : ${STOCK_REL:-<probe failed>}   <- shape only, not the built version"
        echo "  new probe   : ${AFTER_REL:-<probe failed>}   <- shape only, not the built version"
        echo "  version tail:"
        sed -n "$((LAST_ECHO_NO - 1)),\$p" "$SCRIPT" | sed 's/^/    /'

        VERSION_SUFFIX="${EXTRA_SUFFIX}${BRAND_SUFFIX}"
        if [ "$KMI_MODE" = merge ]; then
          VERSION_SUFFIX="${BRAND_SUFFIX}"
        fi

        {
          echo "modified=true"
          echo "version_suffix=${VERSION_SUFFIX}"
          echo "kmi_preserved=${KMI_PRESERVED}"
          echo "kmi_status=${KMI_STATUS}"
          echo "release_preview=${AFTER_REL}"
        } >> "$GITHUB_OUTPUT"
        __write_state true

        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "### Kernel version branding (\`${VERSION}\`)"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Brand | \`${BRAND:-<none>}\` |"
            echo "| keep_kmi | \`${KEEP_KMI}\` |"
            echo "| Appended to version | \`${VERSION_SUFFIX:-<none>}\` |"
            echo "| KMI status | \`${KMI_STATUS}\` |"
            echo "| KMI preserved | \`${KMI_PRESERVED}\` |"
            echo "| Stock probe | \`${STOCK_REL:-<probe failed>}\` |"
            echo "| Rewritten probe | \`${AFTER_REL:-<probe failed>}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
