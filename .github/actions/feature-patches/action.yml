name: 'Apply Feature Patches'
description: >-
  Manifest-driven applier for the feature/patches series (plan v3.0.0 §3.3,
  decisions D15–D19). Fetches the content branch into RUNNER_TEMP (never
  `git switch` the workspace — RC2), parses PATCHES.yml (the operative
  manifest), gates entries on the kernel tree's own Makefile version (D18),
  applies patches with strict `git apply --check` + `git apply` (D15) and
  runs kind: script entries, then emits the CONFIG_* fragment for the
  existing set-kernel-config step (D17).

  D15 amendment (incident run 42248382967): git apply has no offset search
  and rejects insertions that are not context-wrapped on both sides, so a
  tree drifted from the series base (Wild machinery / google-backport)
  fails the strict preflight. On failure this action now records PER-FILE
  forensics (git apply --check -v, failing file list, patch sha256) in the
  patch-apply-logs artifact before surfacing the strict failure.

  D17 fix (incident run 114640000078): config_fragment is emitted one
  symbol per line (multiline GITHUB_OUTPUT heredoc) — the old space-join
  collapsed all symbols into a single line and the consumer's
  line-oriented loop silently dropped all but the first.

inputs:
  manifest_ref:
    description: 'Content branch or pinned SHA. Float `feature/patches` for nightly; pin a SHA for release-grade runs.'
    required: false
    default: 'feature/patches'
  features:
    description: '`default` (manifest enabled: decides) | `off` (skip everything) | comma-list of ids to force-enable'
    required: false
    default: 'default'
  strict:
    description: '`false` downgrades every apply failure to warn+skip (escape hatch, logged loudly).'
    required: false
    default: 'true'
  target_dir:
    description: 'Kernel tree root the series applies against.'
    required: false
    default: '${{ github.workspace }}/kernel/common'

outputs:
  config_fragment:
    description: 'Concatenated CONFIG_* lines of every applied entry (D17).'
    value: ${{ steps.apply.outputs.config_fragment }}
  applied:
    description: 'Comma-list of applied entry ids.'
    value: ${{ steps.apply.outputs.applied }}

runs:
  using: composite
  steps:
    - name: 'Fetch content branch (sparse, into RUNNER_TEMP)'
      shell: bash
      env:
        MANIFEST_REF: ${{ inputs.manifest_ref }}
      run: |
        set -euo pipefail
        CONTENT="$RUNNER_TEMP/feature-patches"
        rm -rf "$CONTENT"
        git clone -q --depth=1 --filter=blob:none --no-checkout \
          "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$CONTENT"
        git -C "$CONTENT" fetch -q --depth=1 origin "$MANIFEST_REF"
        git -C "$CONTENT" checkout -q --detach FETCH_HEAD
        echo "content: $MANIFEST_REF @ $(git -C "$CONTENT" rev-parse --short=12 HEAD)"
        # C1 (plan §4): snapshot the exact content commit this build used into
        # the job env — the verdict sidecar cites it as provenance.
        echo "MANIFEST_SHA=$(git -C "$CONTENT" rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
        # artifacts land in the workspace so the workflow's always() upload
        # step can ship them even when this action fails strict
        mkdir -p "${{ github.workspace }}/patch-apply-logs"

    - name: 'Parse manifest, resolve plan, apply series'
      id: apply
      shell: bash
      env:
        FEATURES: ${{ inputs.features }}
        STRICT: ${{ inputs.strict }}
        TARGET_DIR: ${{ inputs.target_dir }}
        MANIFEST_REF: ${{ inputs.manifest_ref }}
      run: |
        set -euo pipefail
        CONTENT="$RUNNER_TEMP/feature-patches"
        LOGDIR="${{ github.workspace }}/patch-apply-logs"
        python3 -c 'import yaml' 2>/dev/null || pip install -q pyyaml
        export CONTENT LOGDIR MANIFEST_REF
        python3 <<'PYEOF'
        import os, re, subprocess, sys, glob, hashlib, json, datetime, shutil, yaml

        CONTENT = os.environ["CONTENT"]
        LOGDIR  = os.environ["LOGDIR"]
        os.makedirs(LOGDIR, exist_ok=True)
        TARGET  = os.environ["TARGET_DIR"]
        FEATURES = os.environ.get("FEATURES", "default").strip() or "default"
        STRICT  = os.environ.get("STRICT", "true") == "true"
        MANIFEST_REF = os.environ.get("MANIFEST_REF", "")
        MANIFEST_SHA = os.environ.get("MANIFEST_SHA", "")

        # C1 (plan §4, D1): producer-emits-sidecar. Every terminal path of the
        # applier snapshots a machine-readable verdict document to
        # /tmp/feature-patches-verdict.json; the build-summary renderer (C3)
        # and the build-metadata features block (C4) read it from /tmp, and a
        # copy lands in LOGDIR so the always-on patch-apply-logs upload ships
        # it for failed runs too (D15 forensics pattern).
        VERDICT_SIDECAR = "/tmp/feature-patches-verdict.json"

        kver = None   # set once the tree's Makefile is parsed (D18)

        def write_sidecar(doc):
            with open(VERDICT_SIDECAR, "w") as fh:
                json.dump(doc, fh, indent=2)
            shutil.copy(VERDICT_SIDECAR,
                        os.path.join(LOGDIR, "feature-patches-verdict.json"))

        def fatal(msg):
            """Early-FATAL escape (missing manifest, duplicate ids, unknown
            dep/id): emit the minimal sidecar first so the renderer can say
            'applier failed before verdicts' instead of silently omitting the
            section (plan C1.2), then fail loud."""
            write_sidecar({
                "schema": "feature-patches-verdict/v1",
                "generated_utc": datetime.datetime.now(
                    datetime.timezone.utc).isoformat(timespec="seconds"),
                "state": "applier-failed",
                "reason": str(msg)[:400],
                "manifest_ref_input": MANIFEST_REF,
                "manifest_resolved_short_sha": MANIFEST_SHA,
                "mode": FEATURES, "strict": STRICT,
                **({"kernel_version_gate": kver} if kver else {}),
            })
            sys.exit(str(msg))

        def git(args, cwd, check=True):
            r = subprocess.run(["git"] + args, cwd=cwd, capture_output=True, text=True)
            if check and r.returncode != 0:
                raise RuntimeError(f"git {' '.join(args)}: {r.stderr.strip()[:400]}")
            return r

        def patch_forensics(patch_path, target):
            """D15 amendment: capture which file/hunk refused the strict
            preflight (git apply matches only at the stated line and needs
            both-side context around insertions - see the series base notes
            in PATCHES.yml). Returns (verbose output, failing files)."""
            v = subprocess.run(["git", "apply", "--check", "-v", patch_path],
                               cwd=target, capture_output=True, text=True)
            txt = (v.stdout or "") + (v.stderr or "")
            bad = sorted(set(re.findall(r"^error: (?:patch failed: )?(\S+?):", txt, re.M)))
            return txt, bad

        def out(s): print(s, flush=True)
        def warn(s): print(f"::warning::{s}", flush=True)

        mfile = os.path.join(CONTENT, "PATCHES.yml")
        if not os.path.exists(mfile):
            fatal("FATAL: PATCHES.yml not found on the content ref (fail-loud, RC3)")
        manifest = yaml.safe_load(open(mfile))
        entries = manifest.get("patches") or []
        if not entries:
            fatal("FATAL: PATCHES.yml has no patches: entries")

        # D18: version gate from the tree being built
        mk = os.path.join(TARGET, "Makefile")
        def ver(key):
            for line in open(mk):
                if line.startswith(key):
                    return line.split("=")[1].strip()
            return "?"
        kver = f"{ver('VERSION')}.{ver('PATCHLEVEL')}"
        if "?" in kver:
            fatal(f"FATAL: cannot parse VERSION/PATCHLEVEL from {mk}")
        out(f"kernel tree: {kver} @ {TARGET}")

        ids = [e["id"] for e in entries]
        if len(set(ids)) != len(ids):
            fatal("FATAL: duplicate entry ids in PATCHES.yml")

        # parse-time validation (plan §3.2): manifest order == apply order, so
        # every depends_on id must PRECEDE its dependent in the list
        idx = {eid: i for i, eid in enumerate(ids)}
        for e in entries:
            for d in e.get("depends_on") or []:
                if d not in idx:
                    fatal(f"FATAL: {e['id']} depends on unknown id {d}")
                if idx[d] >= idx[e["id"]]:
                    fatal(f"FATAL: {e['id']} depends on {d}, which does not precede it in list order")

        # resolve the active set
        if FEATURES == "off":
            active = []
        elif FEATURES == "default":
            active = [e["id"] for e in entries if e.get("enabled", True)]
        else:
            want = {x.strip() for x in FEATURES.split(",") if x.strip()}
            unknown = want - set(ids)
            if unknown:
                fatal(f"FATAL: unknown feature id(s): {sorted(unknown)}")
            active = [e["id"] for e in entries
                      if e.get("enabled", True) or e["id"] in want]

        verdict = {}   # id -> verdict string, set as encountered
        for e in entries:
            eid = e["id"]
            if eid not in active:
                verdict[eid] = "skip: disabled (manifest enabled: false)"
                continue
            fam = e.get("kernels") or []
            # YAML floats would collapse 5.10 -> 5.1; the operative manifest
            # quotes kernel families — float values are formatted defensively
            fams = [(f"{k:g}" if isinstance(k, float) else str(k)) for k in fam]
            if fam and kver not in fams:
                verdict[eid] = f"skip: kernels gate ({kver} not in {fams})"

        frag, applied, failures = [], [], []
        rows = []
        for e in entries:
            eid = e["id"]
            if verdict.get(eid) is not None:
                rows.append((eid, verdict[eid]))
                continue
            # deps resolved by list order: applied, or kernels-off (fine),
            # anything else (failed/skipped) skips the dependent loudly
            dep_bad = None
            for d in e.get("depends_on") or []:
                dv = verdict.get(d, "")
                if dv != "applied" and not dv.startswith("skip: kernels gate"):
                    dep_bad = f"skip: dep {d}: {dv}"
            if dep_bad:
                verdict[eid] = dep_bad
                warn(f"{eid} {dep_bad}")
                rows.append((eid, verdict[eid]))
                continue
            kind = e.get("kind", "patch")
            try:
                if kind == "patch":
                    p = os.path.join(CONTENT, e["patch"])
                    if not os.path.exists(p):
                        raise RuntimeError(f"patch file missing: {e['patch']}")
                    git(["apply", "--check", p], TARGET)          # D15 preflight
                    git(["apply", p], TARGET)
                elif kind == "script":
                    s = os.path.join(CONTENT, e["script"])
                    if not os.path.exists(s):
                        raise RuntimeError(f"script missing: {e['script']}")
                    r = subprocess.run(["bash", s, TARGET], capture_output=True, text=True)
                    # relay script chatter (warnings are contract - RC3 lesson)
                    for stream in (r.stdout, r.stderr):
                        for ln in stream.splitlines():
                            if any(k in ln for k in ("WARNING", "ERROR", "===" , "SKIP", "skip")):
                                out(f"    [{e['id']}] {ln.strip()[:180]}")
                    if r.returncode != 0:
                        raise RuntimeError(f"script failed rc={r.returncode}: {r.stderr.strip()[:400]}")
                else:
                    raise RuntimeError(f"unknown kind: {kind}")
                verdict[eid] = "applied"
                applied.append(eid)
                frag += [c for c in (e.get("config") or [])]
            except (RuntimeError, subprocess.CalledProcessError) as ex:
                msg = str(ex)
                log = os.path.join(LOGDIR, f"{eid}.log")
                logtxt = msg + "\n"
                bad = []
                if kind == "patch" and e.get("patch"):
                    try:
                        ppath = os.path.join(CONTENT, e["patch"])
                        ftxt, bad = patch_forensics(ppath, TARGET)
                        digest = hashlib.sha256(open(ppath, "rb").read()).hexdigest()[:16]
                        logtxt += (f"patch: {e['patch']} sha256:{digest}\n"
                                   f"failing file(s): {', '.join(bad) or '(none parsed - see -v output)'}\n"
                                   "--- git apply --check -v ---\n" + ftxt)
                    except Exception as _fx:
                        logtxt += f"(forensics unavailable: {_fx})\n"
                open(log, "w").write(logtxt)
                # sweep any .rej produced into the artifact dir
                for rej in glob.glob(os.path.join(TARGET, "**", "*.rej"), recursive=True):
                    dst = os.path.join(LOGDIR, os.path.basename(rej))
                    if os.path.exists(rej) and not os.path.exists(dst):
                        subprocess.run(["cp", rej, dst])
                be = e.get("best_effort", False)
                if be and STRICT:
                    verdict[eid] = f"FAILED (best_effort: warn + skip){' [' + bad[0] + ']' if bad else ''}: {msg[:120]}"
                    warn(f"{eid}: {msg}")
                else:
                    verdict[eid] = f"FAILED (strict){' [' + bad[0] + ']' if bad else ''}: {msg[:120]}"
                    failures.append(eid)
            rows.append((eid, verdict[eid]))

        # C1 (plan §4): full verdict sidecar — written BEFORE the step summary
        # and BEFORE the strict-failure exit below, so failed applies still
        # ship data. Every manifest entry appears in manifest order with its
        # runtime verdict; titles/config/kernels are snapshotted from the
        # exact manifest commit this build used (no renderer re-parse, no
        # drift when a floatable ref moves mid-run).
        def vstate(v):
            return ("applied" if v == "applied"
                    else "failed" if v.startswith("FAILED")
                    else "skipped")          # every other row is a skip variant

        ebyid = {e["id"]: e for e in entries}
        write_sidecar({
            "schema": "feature-patches-verdict/v1",
            "generated_utc": datetime.datetime.now(
                datetime.timezone.utc).isoformat(timespec="seconds"),
            "state": "resolved",
            "manifest_ref_input": MANIFEST_REF,
            "manifest_resolved_short_sha": MANIFEST_SHA,
            "manifest_base": (manifest.get("series") or {}).get("base", ""),
            "mode": FEATURES, "strict": STRICT,
            "kernel_version_gate": kver,
            "totals": {
                "entries": len(rows),
                "applied": sum(1 for _, v in rows if vstate(v) == "applied"),
                "skipped": sum(1 for _, v in rows if vstate(v) == "skipped"),
                "failed": sum(1 for _, v in rows
                              if vstate(v) == "failed"
                              and not v.startswith("FAILED (best_effort")),
                "failed_best_effort": sum(1 for _, v in rows
                                          if v.startswith("FAILED (best_effort")),
                "config_symbols": len(frag),
            },
            "entries": [{
                "id": eid,
                "title": ebyid[eid].get("title") or "",
                "kind": ebyid[eid].get("kind", "patch"),
                # YAML floats would collapse 5.10 -> 5.1; format defensively
                # exactly like the kernels gate does
                "kernels": [(f"{k:g}" if isinstance(k, float) else str(k))
                            for k in (ebyid[eid].get("kernels") or [])],
                "enabled": ebyid[eid].get("enabled", True),
                "verdict_state": vstate(verdict.get(eid, "")),
                "verdict": verdict.get(eid, "not reached"),
                "config": ebyid[eid].get("config") or [],
            } for eid, _ in rows],
        })

        # step summary (silence is a bug — RC3 lesson)
        lines = ["## Feature patches (manifest-driven)", "",
                 "| id | verdict |", "|---|---|"]
        for eid, v in rows:
            mark = ("✅" if v == "applied"
                    else "⚠️" if v.startswith("FAILED (best_effort")
                    else "❌" if v.startswith("FAILED") else "⏭️")
            lines.append(f"| {mark} {eid} | {v} |")
        lines += ["", f"kernel {kver} · mode `{FEATURES}` · strict={STRICT} · applied {len(applied)}/{len(rows)}"]
        with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as fh:
            fh.write("\n".join(lines) + "\n")
        for eid, v in rows:
            out(f"  {eid}: {v}")

        # D17 (incident run 114640000078): the fragment MUST be one symbol per
        # line. The old space-join collapsed all 44 symbols into a single
        # line, so the consumer's line-oriented loop processed exactly one
        # "line" and silently dropped the rest — the governors never got
        # enabled while the build stayed green. Multiline GITHUB_OUTPUT uses
        # the documented heredoc form; consumers that iterate line-by-line
        # AND consumers that word-split an unquoted expansion both then see
        # every symbol. Defensive consumer hardening (belt & braces, in the
        # set-kernel-config step of the build action):
        #   CONFIG_LIST="${CONFIG_LIST// /$'\n'}"
        out(f"config fragment: {len(frag)} symbol(s)")
        for c in frag:
            out(f"  fragment: {c}")
        gout = os.environ.get("GITHUB_OUTPUT")
        if gout:
            with open(gout, "a") as fh:
                fh.write("config_fragment<<FRAG_EOF\n")
                for c in frag:
                    fh.write(c + "\n")
                fh.write("FRAG_EOF\n")
                fh.write(f"applied={','.join(applied)}\n")
        if failures:
            sys.exit(f"FATAL: strict apply failure(s): {', '.join(failures)} — see patch-apply-logs artifact + summary")
        PYEOF
