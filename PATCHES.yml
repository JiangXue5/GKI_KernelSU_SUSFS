  policy: >
    Every vendored file keeps its original copyright header byte-for-byte;
    original commit subjects are quoted verbatim in the series' commit
    messages; full credits also live in THIRD_PARTY_NOTICES.md.
  authors:
    - "Masahito Suzuki (firelzrd) — BORE scheduler; Reflex governor"
    - "Templar Dev (Steambot12) — Vorpal governor"
    - "kusonekoworld-max (koneko_dev) — Bara-no-Seidou governor; MomenToMoiX project; fair.c gaming bias"
    - "Kanagawa Yamada (LoggingNewMemory) — Tenebrion logic + SELinux rules"
    - "TheWildJames (WildKernels) — BORE composite-action port"
    - "Nao-YM — composite-action packaging layer"
